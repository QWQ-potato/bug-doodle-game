        ctx.moveTo(-14, 6);
        ctx.quadraticCurveTo(-16, -12, 2, -13);
        ctx.lineTo(18, -9);
        ctx.lineTo(30, -5);
        ctx.quadraticCurveTo(35, -1, 30, 3);
        ctx.lineTo(14, 4);
        ctx.lineTo(-4, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 上排獠牙
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {
          const tx = 11 + k * 6;
          ctx.moveTo(tx, 3.5);
          ctx.lineTo(tx + 2, 8);
          ctx.lineTo(tx + 4, 3.5);
        }
        ctx.fill();
        ctx.stroke();
        // 金色眉骨棘刺 + 鬃鳍
        ctx.fillStyle = '#ffd43b';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(6, -20);
        ctx.lineTo(12, -10.5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-14, 0);
        ctx.lineTo(-23, 4);
        ctx.lineTo(-15, 7);
        ctx.lineTo(-21, 12);
        ctx.lineTo(-8, 9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 发光龙眼
        ctx.save();
        ctx.fillStyle = '#ffe066';
        ctx.shadowColor = '#f06595';
        ctx.shadowBlur = 6 + glow * 8;
        ctx.beginPath();
        ctx.moveTo(2, -6);
        ctx.quadraticCurveTo(8, -10.5, 14, -6);
        ctx.quadraticCurveTo(8, -3.5, 2, -6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = ADM_INK;
        ctx.beginPath();
        ctx.ellipse(9, -6.5, 1, 2, 0, 0, PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(28, -3, 1.2, 0, PI * 2);
        ctx.fill();
      }

      function drawAdmiralDragon(ship, m) {
        const PI = Math.PI;
        const t = frameCount + ship.bobPhase * 40;
        const sHull = admSeg(m, 0, 0.4);
        const sRise = admSeg(m, 0.12, 0.62);
        const sArm = admSeg(m, 0.3, 0.8);
        const sWing = admSeg(m, 0.3, 0.9);
        const aWing = Math.sqrt(sWing);   // 翼展角度先张开，避免中途被躯干挡住
        const sHead = admSeg(m, 0.5, 1);
        const hipY = admLerp(-3, -36, sRise);
        const torsoTop = admLerp(-24, -86, sRise);
        const gap = sHull * 12;
        const tilt = sHull * 0.1;
        const roar = Math.min(1, ship.recoil || 0);
        const seedBase = Math.floor(frameCount / 3) * 13 + ship.bobPhase * 100;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 0. 紫霄雷云海面暗影 + 锯齿雷纹法阵
        ctx.save();
        ctx.fillStyle = 'rgba(95, 61, 196, 0.28)';
        ctx.beginPath();
        ctx.ellipse(0, 22, 108 + m * 10, 16 + m * 4, 0, 0, PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#cc5de8';
        ctx.lineWidth = 2.4;
        const ringR = 98 + m * 14;
        const ringRy = 13 + m * 4;
        const rot = t * 0.01;
        ctx.beginPath();
        for (let k = 0; k < 24; k++) {
          const a = rot + (k * PI * 2) / 24;
          const rr = k % 2 === 0 ? 1 : 0.86;
          const x = Math.cos(a) * ringR * rr;
          const y = 22 + Math.sin(a) * ringRy * rr;
          if (k === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        // 1. 雷龙蝠翼（战舰形态收拢成背鳍，变形时向上撑开，翼尖缠绕紫电）
        const flap = Math.sin(t * 0.11) * 0.09 * sWing;
        for (let side = -1; side <= 1; side += 2) {
          const rx = side * admLerp(4, 18, aWing);
          const ry = admLerp(-16, torsoTop + 8, sWing);
          for (let k = 0; k < 3; k++) {
            const folded = PI + 0.12 + k * 0.14;
            const base = 5.1 + k * 0.5;
            const spread = side > 0 ? base : (PI * 3 - base);
            const a = admLerp(folded, spread, aWing) + side * flap * (1 + k * 0.3);
            const L = admLerp(38 - k * 6, k === 0 ? 90 : (k === 1 ? 86 : 64), sWing);
            admWingTips[k * 2] = rx + Math.cos(a) * L;
            admWingTips[k * 2 + 1] = ry + Math.sin(a) * L;
          }
          const bx = side * admLerp(8, 14, sWing);
          const by = admLerp(-6, hipY + 4, sWing);
          // 翼膜
          ctx.fillStyle = '#5f3dc4';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(admWingTips[0], admWingTips[1]);
          for (let k = 1; k < 3; k++) {
            const px = admWingTips[(k - 1) * 2];
            const py = admWingTips[(k - 1) * 2 + 1];
            const qx = admWingTips[k * 2];
            const qy = admWingTips[k * 2 + 1];
            ctx.quadraticCurveTo((px + qx) * 0.36 + rx * 0.28, (py + qy) * 0.36 + ry * 0.28, qx, qy);
          }
          ctx.quadraticCurveTo((admWingTips[4] + bx) * 0.36 + rx * 0.28, (admWingTips[5] + by) * 0.36 + ry * 0.28, bx, by);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          // 翼膜粉紫雷脉
          if (sWing > 0.4) {
            ctx.globalAlpha = sWing * 0.8;
            ctx.strokeStyle = '#f783ac';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            for (let k = 0; k < 2; k++) {
              const mx = (admWingTips[k * 2] + admWingTips[k * 2 + 2]) * 0.5;
              const my = (admWingTips[k * 2 + 1] + admWingTips[k * 2 + 3]) * 0.5;
              ctx.moveTo(rx + (mx - rx) * 0.25, ry + (my - ry) * 0.25);
              ctx.lineTo(rx + (mx - rx) * 0.5 + side * 4, ry + (my - ry) * 0.5 - 3);
              ctx.lineTo(rx + (mx - rx) * 0.72, ry + (my - ry) * 0.72);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          // 金色翼骨
          ctx.strokeStyle = '#ffd43b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let k = 0; k < 3; k++) {
            ctx.moveTo(rx, ry);
            ctx.lineTo(admWingTips[k * 2], admWingTips[k * 2 + 1]);
          }
          ctx.stroke();
          ctx.fillStyle = '#ffd43b';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.arc(rx, ry, admLerp(3, 5, sWing), 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          // 翼尖金爪
          if (sWing > 0.2) {
            const tx = admWingTips[0];
            const ty = admWingTips[1];
            ctx.beginPath();
            ctx.moveTo(tx - side * 2, ty + 2);
            ctx.lineTo(tx + side * 7 * sWing, ty - 9 * sWing);
            ctx.lineTo(tx + side * 3, ty + 1);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          // 翼尖紫电
          if (sWing > 0.6 && admRand(seedBase + side * 3.7) < 0.6) {
            admBolt(admWingTips[0], admWingTips[1], admWingTips[2], admWingTips[3], 5, 7, seedBase + side, '#cc5de8', 3);
            admBolt(admWingTips[0], admWingTips[1], admWingTips[0] + side * 14, admWingTips[1] - 26, 4, 6, seedBase + side * 9, '#e599f7', 2.4);
          }
        }

        // 2. 雷龙尾（战舰形态是船尾盘卷龙尾，机甲形态在身后甩动）
        for (let i = 0; i < 7; i++) {
          admTail[i * 2] = admLerp(ADM_TAIL_SHIP[i * 2] - gap, ADM_TAIL_MECH[i * 2], sRise);
          admTail[i * 2 + 1] = admLerp(ADM_TAIL_SHIP[i * 2 + 1], ADM_TAIL_MECH[i * 2 + 1], sRise)
            + Math.sin(t * 0.08 + i * 0.7) * i * admLerp(0.4, 1.6, sRise);
        }
        for (let pass = 0; pass < 2; pass++) {
          ctx.strokeStyle = pass === 0 ? ADM_INK : '#5f3dc4';
          for (let i = 0; i < 6; i++) {
            const w = 13 - i * 1.6;
            ctx.lineWidth = pass === 0 ? w + 4.5 : w;
            ctx.beginPath();
            ctx.moveTo(admTail[i * 2], admTail[i * 2 + 1]);
            ctx.lineTo(admTail[i * 2 + 2], admTail[i * 2 + 3]);
            ctx.stroke();
          }
        }
        ctx.fillStyle = '#ffd43b';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 1.6;
        for (let i = 1; i <= 4; i++) {
          const x0 = admTail[i * 2];
          const y0 = admTail[i * 2 + 1];
          const dx = admTail[i * 2 + 2] - x0;
          const dy = admTail[i * 2 + 3] - y0;
          const dl = Math.hypot(dx, dy) || 1;
          const nx = dy / dl;
          const ny = -dx / dl;
          const hs = 9 - i;
          ctx.beginPath();
          ctx.moveTo(x0 - dx / dl * 3, y0 - dy / dl * 3);
          ctx.lineTo(x0 + nx * hs * 1.3, y0 + ny * hs * 1.3);
          ctx.lineTo(x0 + dx / dl * 4, y0 + dy / dl * 4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }
        {
          // 尾锋：闪电形金色尾刃
          const x0 = admTail[12];
          const y0 = admTail[13];
          const dx = x0 - admTail[10];
          const dy = y0 - admTail[11];
          const dl = Math.hypot(dx, dy) || 1;
          const ux = dx / dl;
          const uy = dy / dl;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(x0 - uy * 7, y0 + ux * 7);
          ctx.lineTo(x0 + ux * 16, y0 + uy * 16);
          ctx.lineTo(x0 + uy * 7, y0 - ux * 7);
          ctx.lineTo(x0 + ux * 4, y0 + uy * 4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        // 3. 雷龙反关节利爪腿
        if (sRise > 0.02) {
          for (let side = -1; side <= 1; side += 2) {
            const kx = side * 22;
            const ky = hipY * 0.5 - 2;
            for (let pass = 0; pass < 2; pass++) {
              ctx.strokeStyle = pass === 0 ? ADM_INK : '#3b1d5e';
              ctx.lineWidth = pass === 0 ? 12 : 7.5;
              ctx.beginPath();
              ctx.moveTo(side * 10, hipY);
              ctx.lineTo(kx, ky);
              ctx.lineTo(side * 14, -2);
              ctx.stroke();
            }
            ctx.fillStyle = '#ffd43b';
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(kx, ky - 4);
            ctx.lineTo(kx + side * 11 * sRise, ky - 10 * sRise);
            ctx.lineTo(kx + side * 2, ky + 4);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }

        // 4. 紫霄龙鳞舰体（变形时裂开，裂缝里窜出粉紫雷电）
        if (sHull > 0.05) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, sHull * 1.5) * 0.5;
          ctx.fillStyle = '#f783ac';
          ctx.fillRect(-gap - 2, -6, gap * 2 + 4, 28);
          ctx.globalAlpha = Math.min(1, sHull * 1.5);
          admBolt(0, -6, 0, 22, 4, gap * 0.6, seedBase + 5, '#f06595', 2.4);
          ctx.restore();
        }
        for (let half = -1; half <= 1; half += 2) {
          ctx.save();
          ctx.translate(half * gap, sHull * 3);
          ctx.rotate(-half * tilt);
          // 背棘（先画，让船体压住根部）
          ctx.fillStyle = '#7048e8';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2;
          for (let k = 0; k < 3; k++) {
            const x = half * (40 + k * 12);
            const hgt = (14 - k * 2.5) * (1 - sHull * 0.4);
            ctx.beginPath();
            ctx.moveTo(x - 6, -2);
            ctx.lineTo(x - 5, -6 - hgt);
            ctx.lineTo(x + 6, -2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.fillStyle = '#3b1d5e';
          dragonHullPath(half);
          ctx.fill();
          ctx.save();
          ctx.clip();
          ctx.fillStyle = '#1f0d38';
          ctx.fillRect(half < 0 ? -104 : -2, 13, 106, 11);
          ctx.fillStyle = '#ffd43b';
          ctx.fillRect(half < 0 ? -104 : -2, 2, 106, 3.5);
          ctx.restore();
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.8;
          dragonHullPath(half, sHull < 0.25);
          ctx.stroke();
          // 粉紫雷纹腰线
          ctx.strokeStyle = '#f06595';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          for (let k = 0; k <= 6; k++) {
            const x = half * (4 + k * 11);
            const y = 9 + (k % 2 === 0 ? 3 : -3);
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
          // 金色龙鳞
          ctx.strokeStyle = 'rgba(255, 212, 59, 0.75)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          for (let k = 0; k < 5; k++) {
            const x = half * (10 + k * 13);
            ctx.moveTo(x - 4, 17);
            ctx.quadraticCurveTo(x, 22, x + 4, 17);
          }
          ctx.stroke();
          ctx.restore();
        }

        // 5. 帝皇躯干（战舰形态是暗紫指挥塔）
        const sw = admLerp(13, 26, sRise);
        const ww = admLerp(16, 14, sRise);
        ctx.fillStyle = '#2b1345';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-ww, hipY);
        ctx.lineTo(ww, hipY);
        ctx.lineTo(sw + 5, torsoTop + 12);
        ctx.lineTo(sw, torsoTop);
        ctx.lineTo(sw * 0.4, torsoTop - 5);
        ctx.lineTo(-sw * 0.4, torsoTop - 5);
        ctx.lineTo(-sw, torsoTop);
        ctx.lineTo(-sw - 5, torsoTop + 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#ffd43b';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-sw + 2, torsoTop + 2);
        ctx.lineTo(0, torsoTop + (hipY - torsoTop) * 0.45);
        ctx.lineTo(sw - 2, torsoTop + 2);
        if (sRise > 0.3) {
          ctx.moveTo(-sw * 0.7, torsoTop + (hipY - torsoTop) * 0.5);
          ctx.lineTo(0, torsoTop + (hipY - torsoTop) * 0.8);
          ctx.lineTo(sw * 0.7, torsoTop + (hipY - torsoTop) * 0.5);
        }
        ctx.stroke();
        if (sRise < 0.9) {
          ctx.globalAlpha = 1 - sRise;
          ctx.fillStyle = '#f06595';
          ctx.fillRect(-10, torsoTop + 5, 6, 2.5);
          ctx.fillRect(4, torsoTop + 5, 6, 2.5);
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#ffd43b';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-ww - 1, hipY - 3, ww * 2 + 2, 6, 2);
        ctx.fill();
        ctx.stroke();
        // 胸口雷霆核心
        const coreY = torsoTop + admLerp(13, 22, sRise);
        const coreR = admLerp(3.5, 8.5, sRise) * (1 + Math.sin(t * 0.2) * 0.1);
        ctx.save();
        ctx.shadowColor = '#f06595';
        ctx.shadowBlur = 8 + m * 10;
        ctx.fillStyle = '#f06595';
        ctx.beginPath();
        ctx.arc(0, coreY, coreR, 0, PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.strokeStyle = '#ffd43b';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, coreY, coreR * 0.38, 0, PI * 2);
        ctx.fill();
        if (sRise > 0.5) {
          for (let k = 0; k < 3; k++) {
            if (admRand(seedBase + k * 2.3) < 0.6) {
              const a = admRand(seedBase + k * 5.1) * PI * 2;
              admBolt(Math.cos(a) * coreR, coreY + Math.sin(a) * coreR,
                Math.cos(a) * (coreR + 10), coreY + Math.sin(a) * (coreR + 10), 3, 3, seedBase + k, '#f783ac', 1.6);
            }
          }
        }

        // 6. 双肩特斯拉雷霆塔（战舰形态是甲板上的两座雷电塔，变形后上肩化作尖刺肩甲 + 雷球炮）
        for (let side = -1; side <= 1; side += 2) {
          const bx = admLerp(side * 26, side * 36, sArm) + side * gap * (1 - sArm);
          const by = admLerp(-5, torsoTop + 3, sArm);
          const ps = admLerp(0.4, 1, sArm);
          const H = admLerp(32, 14, sArm);
          // 机甲利爪手臂
          if (sArm > 0.05) {
            const ex = side * 42;
            const ey = torsoTop + 24;
            const hx = side * 46;
            const hy = hipY + 2;
            ctx.globalAlpha = sArm;
            for (let pass = 0; pass < 2; pass++) {
              ctx.strokeStyle = pass === 0 ? ADM_INK : '#3b1d5e';
              ctx.lineWidth = pass === 0 ? 11 : 6.5;
              ctx.beginPath();
              ctx.moveTo(bx + side * 4, by + 6);
              ctx.lineTo(ex, ey);
              ctx.lineTo(hx, hy);
              ctx.stroke();
            }
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let k = -1; k <= 1; k++) {
              ctx.moveTo(hx, hy + 2);
              ctx.quadraticCurveTo(hx + side * (3 + k * 3), hy + 8, hx + side * (1 + k * 5), hy + 12);
            }
            ctx.stroke();
            ctx.fillStyle = '#ffd43b';
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(ex, ey, 4, 0, PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          // 雷霆塔身
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 7;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx, by - H);
          ctx.stroke();
          ctx.strokeStyle = '#7048e8';
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.lineWidth = 2;
          for (let k = 1; k <= 3; k++) {
            const cy = by - H * (0.18 + k * 0.2);
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 3.6;
            ctx.beginPath();
            ctx.ellipse(bx, cy, 6, 2, 0, 0, PI * 2);
            ctx.stroke();
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = 1.8;
            ctx.stroke();
          }
          // 尖刺肩甲
          ctx.save();
          ctx.translate(bx, by);
          ctx.scale(side * ps, ps);
          ctx.fillStyle = '#5f3dc4';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.4 / ps;
          ctx.beginPath();
          ctx.moveTo(-12, 6);
          ctx.lineTo(-10, -6);
          ctx.lineTo(-2, -10);
          ctx.lineTo(4, -19);
          ctx.lineTo(8, -9);
          ctx.lineTo(19, -15);
          ctx.lineTo(14, -2);
          ctx.lineTo(23, 2);
          ctx.lineTo(12, 10);
          ctx.quadraticCurveTo(0, 14, -12, 6);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = '#ffd43b';
          ctx.lineWidth = 2.2 / ps;
          ctx.beginPath();
          ctx.moveTo(-8, 4);
          ctx.quadraticCurveTo(2, 9, 11, 5);
          ctx.stroke();
          ctx.fillStyle = '#f06595';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.4 / ps;
          ctx.beginPath();
          ctx.arc(2, 0, 3.2, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
          // 雷球炮口
          const orbY = by - H;
          const orR = admLerp(4.5, 7, sArm) * (1 + Math.sin(t * 0.2 + side) * 0.1);
          ctx.fillStyle = '#f06595';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.arc(bx, orbY, orR, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(bx, orbY, orR * 0.42, 0, PI * 2);
          ctx.fill();
          if (admRand(seedBase + side * 5.3) < 0.5) {
            admBolt(bx, orbY, bx + side * 13, orbY - 13, 3, 4, seedBase + side * 2, '#e599f7', 2);
          }
        }
        // 战舰形态：两座雷霆塔之间噼啪拉弧
        if (sArm < 0.3 && admRand(seedBase + 77) < 0.5) {
          ctx.globalAlpha = 1 - sArm / 0.3;
          admBolt(-26, -37, 26, -37, 7, 6, seedBase + 41, '#cc5de8', 2.6);
          ctx.globalAlpha = 1;
        }

        // 7. 雷龙首（战舰形态是船首龙头撞角，变形时升上肩头化作帝皇龙盔）
        const headX = admLerp(84 + gap, 2, sHead);
        const headY = admLerp(-14, torsoTop - 19, sHead);
        const hsc = admLerp(0.95, 1.25, sHead);
        const jaw = 0.1 + Math.sin(t * 0.07) * 0.08 + roar * 0.35;
        if (sHead < 0.95) {
          // 船首龙颈
          ctx.globalAlpha = 1 - sHead;
          for (let pass = 0; pass < 2; pass++) {
            ctx.strokeStyle = pass === 0 ? ADM_INK : '#5f3dc4';
            ctx.lineWidth = pass === 0 ? 13 : 8.5;
            ctx.beginPath();
            ctx.moveTo(66 + gap, -2);
            ctx.quadraticCurveTo(74 + gap, -6, headX - 8, headY + 4);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        ctx.save();
        ctx.translate(headX, headY);
        ctx.rotate(admLerp(-0.12, 0, sHead));
        ctx.scale(hsc, hsc);
        drawDragonHead(jaw, Math.max(sHead * 0.6, roar), sHead > 0.5 ? '#845ef7' : '#5f3dc4');
        ctx.restore();
        if (roar > 0.3) {
          ctx.globalAlpha = roar;
          const mx = headX + 32 * hsc;
          const my = headY + 6 * hsc;
          admBolt(mx, my, mx + 34, my + 6, 4, 5, seedBase + 31, '#f06595', 2.6);
          ctx.globalAlpha = 1;
        }

        // 8. 环绕的紫电碎片（机甲形态）
        if (sWing > 0.05) {
          ctx.strokeStyle = '#e599f7';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = k * 1.05 - t * 0.01;
            const x = Math.cos(a) * 108;
            const y = -62 + Math.sin(a) * 72;
            const s = sWing * (0.7 + 0.3 * Math.sin(t * 0.13 + k));
            ctx.moveTo(x - 4 * s, y - 6 * s);
            ctx.lineTo(x + 1 * s, y - 1 * s);
            ctx.lineTo(x - 2 * s, y + 1 * s);
            ctx.lineTo(x + 4 * s, y + 7 * s);
          }
          ctx.stroke();
        }

        // 9. 变形过程中的紫电能量环
        const pulse = Math.sin(m * PI);
        if (pulse > 0.08) {
          ctx.save();
          ctx.globalAlpha = pulse * 0.85;
          ctx.strokeStyle = '#cc5de8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          const rx0 = 50 + m * 72;
          const ry0 = 26 + m * 64;
          for (let k = 0; k < 28; k++) {
            const a = (k * PI * 2) / 28 + t * 0.03;
            const rr = k % 2 === 0 ? 1 : 0.9;
            const x = Math.cos(a) * rx0 * rr;
            const y = -46 + Math.sin(a) * ry0 * rr;
            if (k === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();
          ctx.strokeStyle = '#f783ac';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, -46, rx0 * 0.72, ry0 * 0.72, 0, 0, PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        admWaves(ship, '#e599f7');
      }

      // 提督机甲炮弹：圣金光枪 / 紫霄雷光弹
      function drawAdmiralShot(cb) {
        const PI = Math.PI;
        const tr = cb.trail;
        const n = tr.length;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (cb.adm === 'titan') {
          for (let k = 1; k < n; k++) {
            const r = k / n;
            ctx.beginPath();
            ctx.moveTo(tr[k - 1].x, tr[k - 1].y);
            ctx.lineTo(tr[k].x, tr[k].y);
            ctx.globalAlpha = r * 0.55;
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = r * 13;
            ctx.stroke();
            ctx.globalAlpha = r * 0.95;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = r * 4.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          ctx.translate(cb.x, cb.y);
          ctx.rotate(frameCount * 0.15);
          ctx.fillStyle = '#fff3bf';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.8;
          admSparkle(0, 0, 14);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffd43b';
          ctx.beginPath();
          ctx.arc(0, 0, 5.5, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-1.5, -1.5, 2, 0, PI * 2);
          ctx.fill();
        } else {
          for (let k = 0; k < n; k++) {
            const r = (k + 1) / n;
            ctx.globalAlpha = r * 0.35;
            ctx.fillStyle = '#f06595';
            ctx.beginPath();
            ctx.arc(tr[k].x, tr[k].y, r * 8, 0, PI * 2);
            ctx.fill();
          }
          if (n > 2) {
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.moveTo(tr[0].x, tr[0].y);
            const fs = Math.floor(frameCount / 2);
            for (let k = 1; k < n; k++) {
              const off = (admRand(k * 3.1 + fs) - 0.5) * 12;
              ctx.lineTo(tr[k].x + off, tr[k].y - off);
            }
            ctx.strokeStyle = '#cc5de8';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          ctx.translate(cb.x, cb.y);
          const seed = Math.floor(frameCount / 2) * 3.3;
          for (let k = 0; k < 4; k++) {
            const a = (k * PI) / 2 + frameCount * 0.2;
            admBolt(Math.cos(a) * 7, Math.sin(a) * 7, Math.cos(a) * 17, Math.sin(a) * 17, 3, 3, seed + k, '#e599f7', 2);
          }
          ctx.fillStyle = '#3b1d5e';
          ctx.strokeStyle = '#f06595';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 8, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 3, 0, PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      // 提督专属特效：炮口闪光 / 命中爆发 / 登场降临。返回 true 表示播放完毕
      function drawAdmiralEffect(ef) {
        const PI = Math.PI;
        const isT = ef.variant === 'titan';
        ctx.save();
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (ef.fx === 'muzzle') {
          const p = 1 - ef.life;
          ctx.translate(ef.x, ef.y);
          ctx.globalAlpha = ef.life;
          ctx.fillStyle = isT ? '#fff3bf' : '#f783ac';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2;
          admSparkle(0, 0, 10 + p * 18);
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = isT ? '#ffd43b' : '#cc5de8';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(0, 0, 8 + p * 26, 0, PI * 2);
          ctx.stroke();
          ef.life -= 0.1;
        } else if (ef.fx === 'hit') {
          const p = 1 - ef.life;
          ctx.translate(ef.x, ef.y);
          ctx.globalAlpha = Math.min(1, ef.life * 1.6);
          if (isT) {
            // 圣光十字爆
            ctx.fillStyle = 'rgba(255, 236, 153, 0.55)';
            ctx.beginPath();
            ctx.arc(0, 0, 14 + p * 42, 0, PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff9db';
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 2.2;
            admSparkle(0, 0, 22 + p * 30);
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = '#ffd43b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            const r1 = 20 + p * 30;
            for (let k = 0; k < 8; k++) {
              const a = (k * PI) / 4 + 0.39;
              ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
              ctx.lineTo(Math.cos(a) * (r1 + 14), Math.sin(a) * (r1 + 14));
            }
            ctx.stroke();
          } else {
            // 天降紫雷 + 锯齿雷爆
            if (ef.life > 0.45) {
              admBolt((admRand(ef.seed) - 0.5) * 40, -160, 0, 0, 7, 14, ef.seed + Math.floor(frameCount / 2), '#cc5de8', 5);
            }
            const r = 16 + p * 38;
            ctx.fillStyle = 'rgba(204, 93, 232, 0.4)';
            ctx.strokeStyle = '#7048e8';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            for (let k = 0; k < 24; k++) {
              const a = (k * PI) / 12;
              const rr = k % 2 === 0 ? r : r * 0.55;
              if (k === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
              else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.strokeStyle = '#f06595';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(0, 0, r * 1.12, 0, PI * 2);
            ctx.stroke();
          }
          ef.life -= 0.055;
        } else if (ef.fx === 'entrance') {
          const s = ef.ship;
          const x = s && ships.includes(s) ? s.x : ef.x;
          const y = s && ships.includes(s) ? s.y : ef.y;
          const p = 1 - ef.life;
          const fade = Math.sin(Math.min(1, p * 1.15) * PI);
          if (isT) {
            // 天穹光柱从天而降
            const drop = Math.min(1, p * 4);
            const bottom = admLerp(-20, y + 24, drop);
            const w = 44 + fade * 56;
            ctx.globalAlpha = fade * 0.5;
            ctx.fillStyle = '#fff3bf';
            ctx.fillRect(x - w / 2, -20, w, bottom + 20);
            ctx.globalAlpha = fade * 0.85;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x - w * 0.16, -20, w * 0.32, bottom + 20);
            ctx.strokeStyle = '#fcc419';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([14, 10]);
            ctx.lineDashOffset = -frameCount * 3;
            ctx.beginPath();
            ctx.moveTo(x - w / 2, -20);
            ctx.lineTo(x - w / 2, bottom);
            ctx.moveTo(x + w / 2, -20);
            ctx.lineTo(x + w / 2, bottom);
            ctx.stroke();
            ctx.setLineDash([]);
            if (drop >= 1) {
              const q = Math.min(1, (p - 0.25) / 0.6);
              ctx.globalAlpha = Math.max(0, 1 - q) * 0.9;
              ctx.strokeStyle = '#ffd43b';
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.ellipse(x, y + 20, 40 + q * 170, 10 + q * 42, 0, 0, PI * 2);
              ctx.stroke();
              ctx.strokeStyle = '#fff9db';
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.ellipse(x, y + 20, 20 + q * 115, 6 + q * 28, 0, 0, PI * 2);
              ctx.stroke();
            }
          } else {
            // 紫霄天雷三连劈
            for (let k = 0; k < 3; k++) {
              const lp = (p - k * 0.17) / 0.16;
              if (lp > 0 && lp < 1) {
                const ox = (k - 1) * 46;
                const bSeed = ef.seed + k * 17 + Math.floor(frameCount / 2);
                ctx.globalAlpha = (1 - lp) * 0.3;
                admBoltPath(x + ox * 2.2, -20, x + ox * 0.4, y + 10, 10, 26, bSeed);
                ctx.strokeStyle = '#e599f7';
                ctx.lineWidth = 26;
                ctx.stroke();
                ctx.globalAlpha = 1 - lp * 0.6;
                admBolt(x + ox * 2.2, -20, x + ox * 0.4, y + 10, 10, 26,
                  bSeed, k === 1 ? '#f06595' : '#cc5de8', 10);
                ctx.globalAlpha = (1 - lp) * 0.35;
                ctx.fillStyle = '#e599f7';
                ctx.beginPath();
                ctx.arc(x + ox * 0.4, y + 10, 40 + lp * 40, 0, PI * 2);
                ctx.fill();
              }
            }
            const q = Math.min(1, p / 0.85);
            ctx.globalAlpha = (1 - q) * 0.9;
            ctx.strokeStyle = '#cc5de8';
            ctx.lineWidth = 4;
            ctx.beginPath();
            const R = 50 + q * 175;
            for (let k = 0; k < 28; k++) {
              const a = (k * PI * 2) / 28;
              const rr = k % 2 === 0 ? R : R * 0.88;
              if (k === 0) ctx.moveTo(x + Math.cos(a) * rr, y + 20 + Math.sin(a) * rr * 0.28);
              else ctx.lineTo(x + Math.cos(a) * rr, y + 20 + Math.sin(a) * rr * 0.28);
            }
            ctx.closePath();
            ctx.stroke();
          }
          ef.life -= 1 / 96;
        } else {
          ef.life = 0;
        }
        ctx.restore();
        return ef.life <= 0;
      }

      function drawShip(ship) {
        const j = jitter(0.8);
        const bobY = Math.sin(frameCount * 0.08 + ship.bobPhase) * 3.2;
        const rock = Math.sin(frameCount * 0.065 + ship.bobPhase) * 0.065;
        const sc = ship.spawnScale;

        // 1. 海面 V 形白色浪花尾迹 (Wake)
        if (ship.wake.length > 2) {
          ctx.save();
          ctx.lineCap = 'round';
          for (let i = 1; i < ship.wake.length; i++) {
            const t = i / ship.wake.length;
            const prev = ship.wake[i - 1];
            const cur = ship.wake[i];
            const spread = (1 - t) * 18 + 3;

            ctx.strokeStyle = 'rgba(51, 154, 240, 0.45)';
            ctx.globalAlpha = t * 0.55;
            ctx.lineWidth = (1 - t) * 4 + 2;

            // 上下两股海浪尾迹
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y - spread * 0.45);
            ctx.lineTo(cur.x, cur.y - spread * 0.45);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y + spread * 0.45);
            ctx.lineTo(cur.x, cur.y + spread * 0.45);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 2. 锁定目标时的手绘航海罗盘准星
        if (ship.targetBug && bugs.includes(ship.targetBug)) {
          const tb = ship.targetBug;
          ctx.save();
          ctx.translate(tb.x, tb.y);
          ctx.rotate(frameCount * 0.04);
          ctx.strokeStyle = '#d9480f';
          ctx.lineWidth = 2.2;
          const r = tb.type.radius * 2 + 12 + Math.sin(frameCount * 0.18) * 2;
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          // 十字罗盘刻度
          for (let k = 0; k < 4; k++) {
            const a = (k * Math.PI) / 2;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (r - 5), Math.sin(a) * (r - 5));
            ctx.lineTo(Math.cos(a) * (r + 5), Math.sin(a) * (r + 5));
            ctx.stroke();
          }
          ctx.restore();
        }

        // 3. 绘制手绘大航海战舰本体（始终直立在海面上，左右翻转朝向）
        ctx.save();
        ctx.translate(ship.x, ship.y + bobY);
        ctx.scale(ship.facing * sc, sc);
        // 提督机甲站起来后更高，摇摆和后坐力幅度收一点，显得稳重
        const swayDamp = ship.cls.isAdmiral ? (1 - 0.6 * (ship.morph || 0)) : 1;
        ctx.rotate((rock - ship.recoil * 0.12) * swayDamp);

        ctx.strokeStyle = '#2b2a29';
        ctx.lineWidth = 2.6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const waveShift = Math.sin(frameCount * 0.14 + ship.bobPhase) * 4;

        // 船底蓝色海浪水面底托（在透明背景上清晰呈现“海上航行”感）
        ctx.save();
        ctx.fillStyle = 'rgba(116, 192, 252, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 22, 54, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // === 20 艘风格迥异的手绘战舰专属造型 ===
        const sid = ship.cls.id;
        const windBillow = 12 + Math.sin(frameCount * 0.12 + ship.bobPhase) * 2.5;
        const flagWave = Math.sin(frameCount * 0.25 + ship.bobPhase) * 4;

        if (sid === 'galleon' || sid === 'pirate' || sid === 'treasure' || sid === 'volcano' || sid === 'unicorn') {
          // 经典大帆战舰族（皇家 / 黑珍珠 / 黄金盖伦 / 熔岩魔舰 / 独角兽帆船）
          ctx.strokeStyle = sid === 'volcano' ? '#1a1212' : '#5c3a21';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(4, 4); ctx.lineTo(4, -52);
          ctx.stroke();
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.moveTo(-20, 4); ctx.lineTo(-20, -40);
          ctx.stroke();

          // 船首斜桅或独角兽金色长角
          ctx.lineWidth = 3;
          ctx.strokeStyle = sid === 'unicorn' ? '#ffd43b' : '#5c3a21';
          ctx.beginPath();
          ctx.moveTo(30, 0); ctx.lineTo(54, -14);
          ctx.stroke();

          // 缆绳
          ctx.strokeStyle = 'rgba(43, 42, 41, 0.5)';
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(4, -48); ctx.lineTo(48, -11);
          ctx.moveTo(4, -44); ctx.lineTo(-20, -34);
          ctx.moveTo(-20, -36); ctx.lineTo(-34, -4);
          ctx.stroke();

          ctx.strokeStyle = '#2b2a29';
          ctx.lineWidth = 2.4;

          // 后帆
          ctx.fillStyle = ship.cls.sail;
          ctx.beginPath();
          ctx.moveTo(-24, -34);
          ctx.quadraticCurveTo(-24 + windBillow, -22, -24, -8);
          ctx.lineTo(-14, -8);
          ctx.quadraticCurveTo(-14 + windBillow * 0.85, -22, -14, -34);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          // 主大帆
          ctx.fillStyle = ship.cls.sail;
          ctx.beginPath();
          ctx.moveTo(-4, -44);
          ctx.quadraticCurveTo(16 + windBillow, -26, -2, -4);
          ctx.lineTo(14, -4);
          ctx.quadraticCurveTo(28 + windBillow, -26, 12, -44);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          // 特色帆面纹章
          if (sid === 'galleon') {
            ctx.strokeStyle = '#e03131'; ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(14, -34); ctx.lineTo(14, -14);
            ctx.moveTo(5, -24); ctx.lineTo(23, -24);
            ctx.stroke();
          } else if (sid === 'pirate') {
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(6, -16); ctx.lineTo(22, -26);
            ctx.moveTo(22, -16); ctx.lineTo(6, -26);
            ctx.stroke();
            ctx.beginPath(); ctx.arc(14, -24, 6, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#2b2d42';
            ctx.beginPath(); ctx.arc(12, -25, 1.4, 0, Math.PI * 2); ctx.arc(16, -25, 1.4, 0, Math.PI * 2); ctx.fill();
          } else if (sid === 'treasure') {
            ctx.strokeStyle = '#228be6'; ctx.lineWidth = 3.2;
            ctx.beginPath();
            ctx.moveTo(4, -34); ctx.lineTo(20, -34);
            ctx.moveTo(6, -24); ctx.lineTo(23, -24);
            ctx.moveTo(4, -14); ctx.lineTo(20, -14);
            ctx.stroke();
          } else if (sid === 'volcano') {
            // 发光火焰纹章
            ctx.fillStyle = '#ff6b00';
            ctx.beginPath();
            ctx.moveTo(14, -36);
            ctx.quadraticCurveTo(24, -24, 14, -12);
            ctx.quadraticCurveTo(4, -24, 14, -36);
            ctx.fill();
            ctx.fillStyle = '#ffd43b';
            ctx.beginPath(); ctx.arc(14, -21, 3.5, 0, Math.PI * 2); ctx.fill();
          } else if (sid === 'unicorn') {
            // 彩虹条纹大帆
            const rain = ['#ff6b6b', '#ffa94d', '#ffe066', '#69db7c', '#74c0fc', '#da77f2'];
            rain.forEach((rc, ri) => {
              ctx.strokeStyle = rc; ctx.lineWidth = 3.6;
              ctx.beginPath();
              ctx.moveTo(3, -38 + ri * 5.2);
              ctx.lineTo(21, -38 + ri * 5.2);
              ctx.stroke();
            });
          }

          // 桅顶旗帜
          ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2;
          ctx.fillStyle = ship.cls.flag;
          ctx.beginPath();
          ctx.moveTo(4, -52);
          ctx.quadraticCurveTo(-8, -56 + flagWave, -22, -49 + flagWave * 0.6);
          ctx.quadraticCurveTo(-8, -46 + flagWave * 0.5, 4, -44);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          // 尾楼与主船体
          ctx.lineWidth = 2.6; ctx.strokeStyle = '#2b2a29';
          ctx.fillStyle = ship.cls.hullDark;
          ctx.beginPath();
          ctx.moveTo(-36, -8); ctx.lineTo(-18, -8); ctx.lineTo(-16, 4); ctx.lineTo(-34, 4);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = sid === 'volcano' ? '#ff6b00' : '#ffe066';
          ctx.fillRect(-31, -4, 4, 4); ctx.fillRect(-24, -4, 4, 4);

          ctx.fillStyle = ship.cls.hull;
          ctx.beginPath();
          ctx.moveTo(-36, 0); ctx.lineTo(36, 0);
          ctx.quadraticCurveTo(44, 2, 34, 18 + j * 0.3);
          ctx.lineTo(-28, 18 - j * 0.3);
          ctx.quadraticCurveTo(-38, 12, -36, 0);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 熔岩船体裂纹 / 普通腰线
          ctx.strokeStyle = ship.cls.trim; ctx.lineWidth = 3.2;
          ctx.beginPath(); ctx.moveTo(-34, 5); ctx.lineTo(35, 5); ctx.stroke();
          if (sid === 'volcano') {
            ctx.strokeStyle = '#ff922b'; ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-20, 16); ctx.lineTo(-12, 8); ctx.lineTo(-4, 14); ctx.lineTo(8, 7); ctx.lineTo(20, 15);
            ctx.stroke();
          }

          // 炮口
          ctx.fillStyle = sid === 'volcano' ? '#ffd43b' : '#2b2a29';
          for (const cx of [-14, 0, 14]) {
            ctx.beginPath(); ctx.arc(cx, 11, 3.2, 0, Math.PI * 2); ctx.fill();
          }

        } else if (sid === 'junk') {
          // 🐉 东方郑和宝船：中式高翘船尾 + 扇形竹骨硬帆 + 红灯笼
          ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 3.8;
          ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(4, -50); ctx.moveTo(-18, 2); ctx.lineTo(-18, -36); ctx.stroke();

          // 中式折叠竹骨硬帆
          ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.3;
          ctx.fillStyle = ship.cls.sail;
          ctx.beginPath();
          ctx.moveTo(-10, -44); ctx.lineTo(24, -40); ctx.quadraticCurveTo(28, -22, 20, -6); ctx.lineTo(-10, -8);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          // 竹骨横条
          ctx.strokeStyle = '#a05a2c'; ctx.lineWidth = 2;
          for (const by of [-34, -25, -16]) {
            ctx.beginPath(); ctx.moveTo(-10, by); ctx.lineTo(24, by + 2); ctx.stroke();
          }
          // 后硬帆
          ctx.fillStyle = '#ffe8cc'; ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(-28, -32); ctx.lineTo(-10, -30); ctx.lineTo(-12, -10); ctx.lineTo(-28, -10);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 朱红高翘福船船身
          ctx.fillStyle = ship.cls.hull; ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(-40, -14); ctx.lineTo(-24, -10); ctx.lineTo(-18, 0);
          ctx.lineTo(34, -4); ctx.lineTo(42, -10);
          ctx.quadraticCurveTo(40, 16, 26, 18); ctx.lineTo(-28, 18); ctx.quadraticCurveTo(-40, 10, -40, -14);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          // 金色龙纹腰线 + 船尾大红灯笼
          ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-34, 4); ctx.lineTo(36, 2); ctx.stroke();
          ctx.fillStyle = '#ff3b30'; ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 1.8;
          ctx.beginPath(); ctx.ellipse(-36, -2, 5, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        } else if (sid === 'viking') {
          // 🛡️ 维京龙头长船：弯月龙首 + 红白条纹方帆 + 船舷一排圆盾
          ctx.strokeStyle = '#5c3a21'; ctx.lineWidth = 3.8;
          ctx.beginPath(); ctx.moveTo(0, 4); ctx.lineTo(0, -48); ctx.stroke();

          // 红白条纹维京方帆
          ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.4;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.moveTo(-16, -42); ctx.lineTo(18, -42);
          ctx.quadraticCurveTo(26 + windBillow * 0.6, -24, 18, -8);
          ctx.lineTo(-16, -8);
          ctx.quadraticCurveTo(-8 + windBillow * 0.4, -24, -16, -42);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          // 红色竖条纹
          ctx.strokeStyle = '#e03131'; ctx.lineWidth = 5;
          for (const sx of [-7, 4, 14]) {
            ctx.beginPath(); ctx.moveTo(sx, -40); ctx.quadraticCurveTo(sx + 5, -24, sx, -10); ctx.stroke();
          }

          // 弯月长船身 + 高耸龙头船首
          ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.6;
          ctx.fillStyle = ship.cls.hull;
          ctx.beginPath();
          ctx.moveTo(-40, -14); ctx.quadraticCurveTo(-30, 4, -18, 4);
          ctx.lineTo(24, 4); ctx.quadraticCurveTo(36, -6, 40, -24);
          ctx.lineTo(48, -20); ctx.lineTo(42, -12);
          ctx.quadraticCurveTo(42, 16, 26, 18); ctx.lineTo(-26, 18); ctx.quadraticCurveTo(-40, 14, -40, -14);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 船舷 5 面彩色圆盾
          const shieldColors = ['#e03131', '#ffd43b', '#1971c2', '#e03131', '#ffd43b'];
          shieldColors.forEach((scol, si) => {
            ctx.fillStyle = scol; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(-20 + si * 10, 9, 5.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          });

        } else if (sid === 'ghost') {
          // 👻 飞翔的荷兰人幽灵船：幽绿荧光 + 锯齿破烂鬼帆 + 漂浮鬼火
          ctx.save();
          ctx.shadowColor = '#63e6be'; ctx.shadowBlur = 14;
          ctx.strokeStyle = '#173835'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.moveTo(4, 4); ctx.lineTo(4, -50); ctx.moveTo(-18, 4); ctx.lineTo(-18, -36); ctx.stroke();

          // 锯齿破损鬼帆
          ctx.fillStyle = 'rgba(150, 242, 215, 0.72)'; ctx.strokeStyle = '#0ca678'; ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(-6, -44); ctx.lineTo(18, -42); ctx.quadraticCurveTo(28, -26, 16, -6);
          ctx.lineTo(10, -12); ctx.lineTo(4, -5); ctx.lineTo(-2, -13); ctx.lineTo(-8, -6);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 幽灵船身
          ctx.fillStyle = 'rgba(43, 88, 83, 0.85)'; ctx.strokeStyle = '#63e6be'; ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(-36, -6); ctx.lineTo(36, -2); ctx.quadraticCurveTo(42, 12, 30, 18);
          ctx.lineTo(-28, 18); ctx.quadraticCurveTo(-38, 10, -36, -6);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 漂浮绿色鬼火
          ctx.fillStyle = '#c3fae8';
          const fw = Math.sin(frameCount * 0.15) * 4;
          ctx.beginPath(); ctx.arc(-28, -22 + fw, 4.5, 0, Math.PI * 2); ctx.arc(32, -16 - fw, 3.8, 0, Math.PI * 2); ctx.fill();
          ctx.restore();

        } else if (sid === 'steampunk') {
          // ⚙️ 蒸汽朋克铁甲舰：双粗烟囱冒烟 + 旋转明轮 + 铆钉铁甲
          // 烟囱冒出的蒸汽云
          ctx.fillStyle = 'rgba(235, 240, 245, 0.85)'; ctx.strokeStyle = '#868e96'; ctx.lineWidth = 1.6;
          const puffY = (frameCount * 0.6) % 16;
          ctx.beginPath(); ctx.arc(-10 - puffY * 0.4, -44 - puffY, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.arc(10 - puffY * 0.4, -42 - puffY, 5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

          // 双青铜大烟囱
          ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.5;
          ctx.fillStyle = '#4f3b28';
          ctx.fillRect(-16, -38, 11, 34); ctx.strokeRect(-16, -38, 11, 34);
          ctx.fillRect(4, -34, 11, 30); ctx.strokeRect(4, -34, 11, 30);
          ctx.fillStyle = '#f59f00';
          ctx.fillRect(-18, -40, 15, 6); ctx.strokeRect(-18, -40, 15, 6);
          ctx.fillRect(2, -36, 15, 6); ctx.strokeRect(2, -36, 15, 6);

          // 铆钉铁甲船体
          ctx.fillStyle = ship.cls.hull;
          ctx.beginPath();
          ctx.moveTo(-36, -4); ctx.lineTo(30, -4); ctx.lineTo(44, 6); ctx.lineTo(32, 18); ctx.lineTo(-30, 18);
          ctx.closePath(); ctx.fill(); ctx.stroke();

          // 旋转侧舷大明轮
          ctx.save();
          ctx.translate(-2, 11);
          ctx.rotate(frameCount * 0.14);
          ctx.fillStyle = '#f59f00'; ctx.strokeStyle = '#2b2a29'; ctx.lineWidth = 2.2;
          ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          for (let sp = 0; sp < 4; sp++) {
            const a = (sp * Math.PI) / 4;
            ctx.beginPath(); ctx.moveTo(Math.cos(a) * -10, Math.sin(a) * -10); ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10); ctx.stroke();
          }
