      // B站“单个杀灭”礼物触发：精准苍蝇拍逐个拍，送几个拍几下（合体虫一下打掉一层）
      function killSingleBugs(count = 1, user = '', gift = '') {
        if (bugs.length === 0) {
          if (user) showToast(`🩴 ${user} 送出「${gift}」，但画布上现在没有虫子啦~`);
          return;
        }
        const total = totalBugCount();
        const n = Math.min(count, total);
        if (user) {
          showToast(n < count
            ? `🩴 ${user} 送出「${gift}」x${count}，把画布上 ${n} 只虫子全部拍扁！`
            : `🩴 ${user} 送出「${gift}」，精准拍扁 ${n} 只虫子！`);
        }
        const step = n > 30 ? Math.max(15, 2500 / n) : 85;
        for (let i = 0; i < n; i++) {
          setTimeout(() => {
            if (bugs.length === 0) return;
            // 先拍小虫，最后拍大虫
            let bug = bugs[0];
            for (const b of bugs) if (b.stack < bug.stack) bug = b;
            activeEffects.push({
              kind: 'swatter',
              x: bug.x,
              y: bug.y,
              life: 1,
              angle: -0.3 + (Math.random() - 0.5) * 0.4
            });
            screenShake = Math.max(screenShake, 5);
            hitBug(bug, 'swatter', i > 3);
          }, i * step);
        }
      }

      // 战舰三种模式：
      //   lamp    老舰长送灯牌召唤，存在 1 分钟，只在主人送礼物时开炮
      //   guard   新上舰长召唤，存在 30 分钟，自动攻击（前 5 分钟火力最猛，之后慢慢变弱）
      //   admiral 提督至尊舰船，当天常驻（北京时间 24 点消失）；每送 1 个灯牌自动杀虫 5 分钟（可叠加），提督本人送礼物时全力开火
      const SHIP_MODE_RANK = { lamp: 0, guard: 1, admiral: 2 };
      const GUARD_FULL_POWER_MS = 5 * 60 * 1000;   // 新舰长满火力时长
      const GUARD_FIRE_FAST = 50;                   // 满火力：约 0.8 秒一炮
      const GUARD_FIRE_SLOW = 180;                  // 30 分钟末尾：约 3 秒一炮
      const AUTO_FIRE_PER_SEC = 2.5;                // 全场所有守护船加起来每秒最多自动开几炮
      let autoFireBudget = 3;

      function findOwnerShip(uid, name) {
        if (uid) {
          const byUid = ships.find((s) => s.ownerUid === uid);
          if (byUid) return byUid;
        }
        return name ? ships.find((s) => s.ownerName === name) : null;
      }

      // 船主人送了任意礼物 -> 自己的船开炮（提督全力开火：每个礼物 3 炮）
      function shipReactToGift(msg) {
        const ship = findOwnerShip(msg.uid || 0, msg.user || '');
        if (!ship || ship.sinking) return;
        // 场上没虫子、礼物是付费的、有别人的船 -> 按电池数打别人的船
        if (bugs.length === 0 && queueShipPvp(ship, msg.batteries || 0, msg.gift || '礼物')) return;
        const n = Math.max(1, msg.count || 1);
        if (ship.mode === 'admiral') {
          ship.pendingAttacks = Math.min(60, ship.pendingAttacks + n * 3);
          ship.morphShowcaseTimer = 180;
        } else {
          ship.pendingAttacks = Math.min(20, ship.pendingAttacks + n);
        }
      }

      // ============================
      // 战舰互殴
      // ============================
      // 服务器给的 unix 毫秒时间 -> 页面 performance.now() 时间
      function admiralExpireAt(opts, now) {
        return opts.expireAt ? now + (opts.expireAt - Date.now()) : null;
      }

      function fmtLeft(ms) {
        const sec = Math.max(0, Math.ceil(ms / 1000));
        return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      }

      function shipAlive(s) {
        return s && !s.sinking && ships.includes(s);
      }

      function hasEnemyShip(ship) {
        return ships.some((s) => s !== ship && !s.sinking);
      }

      // 把 dmg 点伤害拆成几发炮弹排队打出去（1 电池 = 1 点血）
      function queueShipPvp(ship, dmg, giftName) {
        dmg = Math.floor(dmg || 0);
        if (dmg <= 0 || !shipAlive(ship) || !hasEnemyShip(ship)) return false;
        const shots = Math.max(1, Math.min(6, Math.ceil(dmg / 20)));
        const base = Math.floor(dmg / shots);
        let extra = dmg - base * shots;
        for (let i = 0; i < shots; i++) {
          ship.pvpShots.push(base + (extra > 0 ? 1 : 0));
          if (extra > 0) extra--;
        }
        if (ship.cls.isAdmiral) ship.morphShowcaseTimer = 180;
        showToast(`💣 ${ship.ownerName || '神秘船长'} 送出「${giftName}」，场上没有虫子，炮口转向别人的战舰！(${dmg} 点伤害)`);
        return true;
      }

      // 离得最近的敌船
      function pickEnemyShip(ship) {
        let best = null;
        let bestD = Infinity;
        for (const s of ships) {
          if (s === ship || s.sinking) continue;
          const d = Math.hypot(s.x - ship.x, s.y - ship.y);
          if (d < bestD) { bestD = d; best = s; }
        }
        return best;
      }

      function damageShip(target, dmg, attackerName) {
        if (!shipAlive(target)) return;
        target.hp = Math.max(0, target.hp - dmg);
        target.hitFlash = 1;
        target.lastAttacker = attackerName || '神秘船长';
        floatTexts.push({
          x: target.x + (Math.random() - 0.5) * 20, y: target.y - 40, vy: -1.3,
          text: `-${dmg}`, color: '#e03131', scale: 1.15, life: 1
        });
        if (target.hp <= 0) sinkShip(target);
      }

      function sinkShip(ship) {
        ship.sinking = 1;
        ship.pendingAttacks = 0;
        ship.pvpShots = [];
        ship.pendingUlt = false;
        playCannonSound();
        screenShake = Math.max(screenShake, 14);
        activeEffects.push({ kind: 'cannonBlast', x: ship.x, y: ship.y, maxR: 90, life: 1 });
        floatTexts.push({ x: ship.x, y: ship.y - 70, vy: -0.9, text: '💥 击沉！', color: '#e03131', scale: 1.6, life: 1.6 });
        const sec = Math.round(ship.respawnMs / 1000);
        const wait = sec >= 60 && sec % 60 === 0 ? `${sec / 60} 分钟` : `${sec} 秒`;
        showToast(`💥 ${ship.lastAttacker} 击沉了 ${ship.ownerName || '神秘船长'} 的「${ship.cls.name}」！${wait}后送灯牌可满血复活`);
      }

      // 沉船动画播完：从场上拿掉，登记冷却（提督 5 分钟 / 舰长 10 分钟），冷却过后主人送灯牌才复活
      function finishSinking(ship, now) {
        sunkShips.push({
          ownerUid: ship.ownerUid, ownerName: ship.ownerName,
          reviveAt: now + ship.respawnMs,
          keep: {
            guardStart: ship.guardStart || 0,
            guardDurationMs: ship.guardDurationMs,
            expiresAt: ship.expiresAt,
            autoFireUntil: ship.autoFireUntil || 0,
            ultHits: ship.ultHits, ultCharge: ship.ultCharge
          },
          opts: {
            user: ship.ownerName, uid: ship.ownerUid, shipClass: ship.cls.id, mode: ship.mode,
            avatarImg: ship.avatarImg, attackCount: 0, ultHits: ship.ultTargetHits,
            respawnSec: Math.round(ship.respawnMs / 1000), respawn: true
          }
        });
      }

      function findSunkEntry(uid, name) {
        if (uid) {
          const e = sunkShips.find((x) => x.ownerUid === uid);
          if (e) return e;
        }
        return name ? sunkShips.find((x) => x.ownerName === name) : null;
      }

      // 冷却已过、主人送了灯牌：把原来那艘船满血捞回来（守护时间、提督自动杀虫时间照旧算）
      function reviveShip(e, now) {
        sunkShips.splice(sunkShips.indexOf(e), 1);
        // 灯牌船 / 守护船沉着的时候已经到期：不捞旧船，这次灯牌按正常流程召唤新船
        if (e.opts.mode !== 'admiral' && e.keep.expiresAt && now >= e.keep.expiresAt) return null;
        summonShip(e.opts);
        const ship = findOwnerShip(e.ownerUid, e.ownerName);
        if (!ship) return null;
        ship.expiresAt = e.keep.expiresAt;
        if (e.keep.guardStart) {
          ship.guardStart = e.keep.guardStart;
          ship.guardDurationMs = e.keep.guardDurationMs;
        }
        if (ship.mode === 'admiral') ship.autoFireUntil = e.keep.autoFireUntil || 0;
        ship.ultHits = e.keep.ultHits || 0;
        ship.ultCharge = e.keep.ultCharge || 0;
        return ship;
      }

      // 船身下方的血条，残血变红
      function hpRect(x, y, w, h, r) {
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, Math.min(r, w / 2)); else ctx.rect(x, y, w, h);
      }

      function drawShipHpBar(ship) {
        if (ship.sinking || ship.spawnScale < 1) return;
        const w = ship.cls.isAdmiral ? 96 : 66;
        const h = 8;
        const x = ship.x - w / 2;
        const y = ship.y + (ship.cls.isAdmiral ? 64 : 38);
        const r = ship.hp / ship.maxHp;
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.strokeStyle = '#2b2a29';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        hpRect(x, y, w, h, 4);
        ctx.fill();
        ctx.fillStyle = r <= SHIP_LOW_HP_RATIO ? '#e03131' : r <= 0.6 ? '#f59f00' : '#37b24d';
        if (ship.hitFlash > 0) ctx.fillStyle = '#fff';
        ctx.beginPath();
        hpRect(x, y, Math.max(0, w * r), h, 4);
        ctx.fill();
        ctx.beginPath();
        hpRect(x, y, w, h, 4);
        ctx.stroke();
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#fff';
        const nowT = performance.now();
        const label = ship.mode === 'admiral' && ship.autoFireUntil > nowT
          ? `${ship.hp}/${ship.maxHp} · 自动杀虫 ${fmtLeft(ship.autoFireUntil - nowT)}`
          : `${ship.hp}/${ship.maxHp}`;
        ctx.strokeText(label, ship.x, y + h + 2);
        ctx.fillStyle = '#2b2a29';
        ctx.fillText(label, ship.x, y + h + 2);
        ctx.restore();
      }

      // 残血船冒黑烟
      function emitShipSmoke(ship) {
        particles.push({
          kind: 'smoke',
          x: ship.x + (Math.random() - 0.5) * (ship.cls.isAdmiral ? 50 : 30),
          y: ship.y - (ship.cls.isAdmiral ? 30 : 12),
          vx: (Math.random() - 0.5) * 0.6, vy: -1.2 - Math.random() * 0.8,
          size: 8 + Math.random() * 8, life: 1, decay: 0.014
        });
      }

      function guardFireInterval(ship, now) {
        const age = now - (ship.guardStart || now);
        if (age <= GUARD_FULL_POWER_MS) return GUARD_FIRE_FAST;
        const total = Math.max(1, (ship.guardDurationMs || 1800000) - GUARD_FULL_POWER_MS);
        const t = Math.min(1, (age - GUARD_FULL_POWER_MS) / total);
        return GUARD_FIRE_FAST + (GUARD_FIRE_SLOW - GUARD_FIRE_FAST) * t;
      }

      // 提督定时大招：全屏清场
      function triggerAdmiralScreenClear(ship) {
        if (bugs.length === 0) return;
        const isTitan = ship.cls.id === 'admiral_titan';
        ship.morphShowcaseTimer = 200;
        ship.recoil = 1.4;
        ship.ultCharge = 0;
        playTransformSound();
        playUltimateSound(isTitan ? 'tempest' : 'maelstrom');
        screenShake = Math.max(screenShake, 16);
        activeEffects.push({
          kind: 'admiralFx', fx: 'entrance', variant: isTitan ? 'titan' : 'dragon',
          ship, x: ship.x, y: ship.y, seed: Math.random() * 1000, life: 1
        });
        for (let i = 0; i < 20; i++) {
          activeEffects.push({
            kind: 'gas',
            x: width * 0.1 + Math.random() * width * 0.8,
            y: height * 0.15 + Math.random() * height * 0.7,
            r: 30 + Math.random() * 55, life: 1,
            vx: (Math.random() - 0.5) * 1.4, vy: -0.5 - Math.random() * 0.9
          });
        }
        floatTexts.push({
          x: ship.x, y: ship.y - 130, vy: -1, text: '👑 至尊大招·全屏清场！',
          color: isTitan ? '#e67700' : '#9c36b5', scale: 1.5, life: 1.6
        });
        const targets = [...bugs];
        const total = totalBugCount();
        showToast(`👑 ${ship.cls.name} 释放至尊大招，全屏清场 ${total} 只虫子！`);
        targets.forEach((b, i) => {
          setTimeout(() => {
            if (bugs.includes(b)) eliminateBug(b, 'cannon', i > 3);
          }, 500 + Math.min(i * 12, 900));
        });
      }

      function summonShip(opts = {}) {
        const ownerName = opts.user || '';
        const ownerUid = opts.uid || 0;
        const giftName = opts.gift || '粉丝团灯牌';
        const mode = opts.mode || (opts.shipClass && opts.shipClass.startsWith('admiral') ? 'admiral' : 'lamp');
        const durationSec = mode === 'guard' ? (opts.durationSec || 1800) : (opts.durationSec || 60);
        const durationMs = durationSec * 1000;
        const ultTargetHits = opts.ultHits || 5;
        const attackCount = Math.max(0, opts.attackCount != null ? opts.attackCount : 1);
        const now = performance.now();

        // 船被击沉了：冷却没到不能复活；冷却到了，这次灯牌让它满血复活
        if (!opts.respawn && (ownerName || ownerUid)) {
          const sunk = findSunkEntry(ownerUid, ownerName);
          if (sunk) {
            if (opts.restore) return;
            if (now < sunk.reviveAt) {
              // 冷却期间送的灯牌：提督的自动杀虫时间、新上舰的守护时间照样记上
              if (mode === 'admiral') {
                sunk.keep.expiresAt = admiralExpireAt(opts, now);
                if (opts.autoFireSec) sunk.keep.autoFireUntil = now + opts.autoFireSec * 1000;
              }
              if (mode === 'guard') {
                sunk.opts.mode = 'guard';
                sunk.keep.guardStart = now;
                sunk.keep.guardDurationMs = durationMs;
                sunk.keep.expiresAt = now + durationMs;
              }
              showToast(`🔧 ${ownerName || '神秘船长'} 的战舰还在维修，${fmtLeft(sunk.reviveAt - now)} 后送灯牌才能复活！`);
              return;
            }
            const revived = reviveShip(sunk, now);
            summonShip({ ...opts, respawn: true });
            if (revived) showToast(`⚓ ${ownerName || '神秘船长'} 送出「${giftName}」，「${revived.cls.name}」满血复活！`);
            return;
          }
        }

        // 同一个人已有船在场上：按模式刷新/升级
        if (ownerName || ownerUid) {
          let existing = findOwnerShip(ownerUid, ownerName);
          // 画布重连时恢复的提督船：已经在场就不用再来一艘
          if (existing && opts.restore) return;
          if (existing && existing.sinking) return;
          // 普通船升级成提督船：换成机甲船重新登场
          if (existing && mode === 'admiral' && existing.mode !== 'admiral') {
            ships.splice(ships.indexOf(existing), 1);
            activeEffects.push({ kind: 'waveSplash', x: existing.x, y: existing.y, maxR: 72, life: 1 });
            existing = null;
          }
          if (existing) {
            if (ownerUid) existing.ownerUid = ownerUid;
            if (SHIP_MODE_RANK[mode] > SHIP_MODE_RANK[existing.mode]) existing.mode = mode;
            if (mode === 'guard') {
              // 再次上舰：重新满火力守护 30 分钟
              existing.guardStart = now;
              existing.guardDurationMs = durationMs;
            }
            if (existing.mode === 'admiral') {
              existing.expiresAt = admiralExpireAt(opts, now);
              if (mode === 'admiral' && opts.autoFireSec != null) {
                existing.autoFireUntil = now + opts.autoFireSec * 1000;
              }
            } else {
              // 只延长不缩短：守护船收到灯牌不会从 30 分钟变回 1 分钟
              existing.expiresAt = Math.max(existing.expiresAt || 0, now + durationMs);
            }
            if (existing.mode === 'admiral') {
              existing.pendingAttacks = Math.min(60, existing.pendingAttacks + attackCount * 3);
            } else {
              existing.pendingAttacks += attackCount;
            }
            if (mode === 'guard') {
              showToast(`🛡️ 新舰长续航！「${existing.cls.name}」重新满火力守护 ${Math.round(durationSec / 60)} 分钟！`);
            }
            if (opts.avatar) {
              const img = new Image();
              img.crossOrigin = 'anonymous';
              img.src = opts.avatar;
              existing.avatarImg = img;
            }
            existing.ultTargetHits = ultTargetHits;
            existing.ultHits += attackCount;
            if (existing.cls.isAdmiral) {
              existing.morphShowcaseTimer = 180;
            }

            let triggeredUlt = false;
            if (existing.ultHits >= existing.ultTargetHits) {
              existing.ultHits = existing.ultHits % existing.ultTargetHits;
              triggeredUlt = true;
            }
            existing.ultCharge = existing.ultHits / existing.ultTargetHits;

            if (triggeredUlt) {
              if (bugs.length > 0) {
                triggerShipUltimate(existing);
              } else {
                showToast(`⛵ 战舰多次收到「${giftName}」触发大招（当前无虫子）！`);
              }
            } else if (attackCount > 0 && existing.mode === 'admiral' && existing.autoFireUntil > now) {
              showToast(`👑 提督送出「${giftName}」x${attackCount}，至尊舰船自动杀虫还剩 ${fmtLeft(existing.autoFireUntil - now)}！`);
            } else if (attackCount > 0 && mode !== 'guard') {
              showToast(`⛵ 战舰收到「${giftName}」x${attackCount}，开炮攻击 ${attackCount} 次！(充能 ${existing.ultHits}/${existing.ultTargetHits})`);
            }
            return;
          }
        }

        let cls = SHIP_CLASSES[shipVariantIndex % SHIP_CLASSES.length];
        if (opts.shipClass) {
          const found = ADMIRAL_SHIP_CLASSES.find((c) => c.id === opts.shipClass)
            || SHIP_CLASSES.find((c) => c.id === opts.shipClass);
          if (found) cls = found;
        }

        let avatarImg = opts.avatarImg || shipAvatarImages[shipVariantIndex % shipAvatarImages.length];
        if (opts.avatar && !opts.avatarImg) {
          const customImg = new Image();
          customImg.crossOrigin = 'anonymous';
          customImg.src = opts.avatar;
          avatarImg = customImg;
        }
        if (!cls.isAdmiral) {
          shipVariantIndex++;
        }

        // 达到上限时：先换掉 1 分钟灯牌船，再换守护船，提督船最后
        if (ships.length >= MAX_SHIPS) {
          let removeIdx = ships.findIndex((s) => s.mode === 'lamp');
          if (removeIdx < 0) removeIdx = ships.findIndex((s) => s.mode === 'guard');
          if (removeIdx < 0) removeIdx = 0;
          const [old] = ships.splice(removeIdx, 1);
          activeEffects.push({
            kind: 'waveSplash',
            x: old.x,
            y: old.y,
            maxR: 72,
            life: 1
          });
        }

        const pos = safeSpawnPos();
        const angle = (Math.random() < 0.5 ? 0 : Math.PI) + (Math.random() - 0.5) * 0.9;
        const initUltTrigger = attackCount >= ultTargetHits;
        const initUltHits = initUltTrigger ? (attackCount % ultTargetHits) : attackCount;

        const ship = {
          cls,
          avatarImg,
          ownerName,
          ownerUid,
          mode,
          guardStart: mode === 'guard' ? now : 0,
          guardDurationMs: mode === 'guard' ? durationMs : 0,
          autoFireTimer: 40,
          autoFireUntil: mode === 'admiral' ? now + (opts.autoFireSec || 0) * 1000 : 0,
          x: pos.x,
          y: pos.y,
          angle,
          targetAngle: angle,
          facing: Math.cos(angle) >= 0 ? 1 : -1,
          spawnScale: 0.15,
          fireCooldown: 18,
          patrolTimer: 50 + Math.random() * 70,
          targetBug: null,
          wake: [],
          bobPhase: Math.random() * Math.PI * 2,
          recoil: 0,
          expiresAt: mode === 'admiral' ? admiralExpireAt(opts, now) : now + durationMs,
          pendingAttacks: mode === 'admiral' ? Math.min(60, attackCount * 3) : attackCount,
          ultHits: initUltHits,
          ultTargetHits,
          ultCharge: initUltHits / ultTargetHits,
          pendingUlt: initUltTrigger,
          morph: 0,
          morphTarget: cls.isAdmiral ? 1 : 0,
          morphShowcaseTimer: cls.isAdmiral ? 180 : 0,
          hp: mode === 'admiral' ? ADMIRAL_MAX_HP : SHIP_MAX_HP,
          maxHp: mode === 'admiral' ? ADMIRAL_MAX_HP : SHIP_MAX_HP,
          hitFlash: 0,
          pvpShots: [],
          sinking: 0,
          respawnMs: (opts.respawnSec || 180) * 1000
        };
        ships.push(ship);

        if (cls.isAdmiral) {
          playTransformSound();
          screenShake = Math.max(screenShake, 11);
          // 提督专属登场：圣金天穹 = 天穹光柱降临；紫霄雷龙 = 紫霄天雷三连劈（约 1.6 秒）
          const isTitanCls = cls.id === 'admiral_titan';
          activeEffects.push({
            kind: 'admiralFx',
            fx: 'entrance',
            variant: isTitanCls ? 'titan' : 'dragon',
            ship,
            x: pos.x,
            y: pos.y,
            seed: Math.random() * 1000,
            life: 1
          });
          for (let i = 0; i < 12; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;
            const spd = 3 + Math.random() * 5;
            particles.push({
              kind: isTitanCls ? 'star' : 'scribble',
              x: pos.x + (Math.random() - 0.5) * 60,
              y: pos.y - 10,
              vx: Math.cos(a) * spd,
              vy: Math.sin(a) * spd,
              size: isTitanCls ? 5 + Math.random() * 4 : 8 + Math.random() * 8,
              rot: Math.random() * Math.PI * 2,
              vrot: (Math.random() - 0.5) * 0.3,
              life: 1,
              decay: 0.02 + Math.random() * 0.015,
              color: i % 2 === 0 ? '#cc5de8' : '#f06595'
            });
          }
        } else {
          playHornSound();
          screenShake = Math.max(screenShake, 7);
        }

        // 破浪登场水花特效
        activeEffects.push({
          kind: 'waveSplash',
          x: pos.x,
          y: pos.y,
          maxR: 92,
          life: 1
        });

        for (let i = 0; i < 16; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * 4.5;
          particles.push({
            kind: i % 3 === 0 ? 'puff' : 'scribble',
            x: pos.x,
            y: pos.y + 12,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - 1.5,
            size: 5 + Math.random() * 6,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1,
            decay: 0.028 + Math.random() * 0.018,
            color: i % 2 === 0 ? '#339af0' : '#a5d8ff'
          });
        }

        // 横幅不显示观众昵称

          x: pos.x,
          y: pos.y - 54,
          vy: -1.1,

          color: '#1971c2',

          life: 1.35
        });

        // 提示条不显示观众昵称
        if (opts.restore) {

        } else if (mode === 'admiral') {

          showToast(`👑 提督至尊舰船「${cls.name}」降临！今天一直在场${autoTip}，每送 1 个灯牌自动杀虫 5 分钟！`);
        } else if (mode === 'guard') {

          showToast(`⛵ 「${cls.name}」登场（存在${durationSec}秒，送礼物就开炮，连刷${ultTargetHits}个灯牌放大招）！`);

      // 礼物变成杀虫剂：按威力消灭场上百分之几的虫子（合体虫算里面的数量）
      function triggerPesticide(power = 50, user = '', gift = '') {
        const total = totalBugCount();
        playSpraySound();
        for (let i = 0; i < 18; i++) {
          activeEffects.push({
            kind: 'gas',
            x: width * 0.12 + Math.random() * width * 0.76,
            y: height * 0.18 + Math.random() * height * 0.62,
            r: 28 + Math.random() * 50, life: 1,
            vx: (Math.random() - 0.5) * 1.4, vy: -0.5 - Math.random() * 0.9
          });
        }
        const who = user ? `${user} 的「${gift || '礼物'}」` : '礼物';
        if (total === 0) {
          showToast(`🧴 ${who}变成了杀虫剂！可惜现在没有虫子~`);
          return;
        }
        let toKill = Math.max(1, Math.ceil(total * Math.min(100, power) / 100));
        const killed = toKill;
        const pool = [...bugs].sort(() => Math.random() - 0.5);
        const victims = [];
        for (const b of pool) {
          if (toKill <= 0) break;
          if (b.stack <= toKill) {
            toKill -= b.stack;
            victims.push(b);
          } else {
            // 合体虫只被毒掉一部分
            b.stack -= toKill;
            b.mergeFlash = 1;
            b.dizzy = 1;
            killCount += toKill;
            score += b.type.points * toKill;
            toKill = 0;
          }
        }
        victims.forEach((b) => { b.dizzy = 1; });
        showToast(`🧴 ${who}变成了杀虫剂！毒倒 ${killed} 只虫子（${power}%）！`);
        floatTexts.push({ x: width / 2, y: height * 0.35, vy: -0.9, text: `🧴 杀虫剂！-${killed}`, color: '#2f9e44', scale: 1.5, life: 1.4 });
        setTimeout(() => {
          victims.forEach((b, i) => {
            if (bugs.includes(b)) eliminateBug(b, 'spray', i > 4);
          });
          updateHUD();
        }, 380);
        updateHUD();
      }

      function findDensestBugSpot(fallbackX, fallbackY) {
        if (bugs.length === 0) return { x: fallbackX, y: fallbackY };
        let bestBug = bugs[0];
        let bestCount = -1;
        for (const candidate of bugs) {
          let count = 0;
          for (const other of bugs) {
            if (Math.hypot(other.x - candidate.x, other.y - candidate.y) < 175) {
              count++;
            }
          }
          if (count > bestCount) {
            bestCount = count;
            bestBug = candidate;
          }
        }
        return { x: bestBug.x, y: bestBug.y };
      }

      function triggerShipUltimate(ship) {

        ship.recoil = 1.4;

          });

        } else if (chosen === 'kraken') {
          activeEffects.push({
            kind: 'kraken',
            x: target.x,

            radius: 190,
            rot: Math.random() * Math.PI,

            life: 1
          });
          floatTexts.push({
            x: ship.x,
            y: ship.y - 102,
            vy: -1.1,

          });

        } else {
          // 💥 舷侧烈焰齐射：8 发超大范围烈焰加农炮弹地毯式轰炸

              const spreadA = (Math.PI * 2 * k) / count + Math.random() * 0.4;

              const ty = Math.max(95, Math.min(height - 155, target.y + Math.sin(spreadA) * spreadR));

          floatTexts.push({

      }

      // =====================================================
      // 👑 提督专属可变形机甲战舰（圣金天穹 / 紫霄雷龙）
      //   m = 0 战舰形态 → m = 1 机甲形态；各部件按阶段依次变形
      //   （船体裂开 → 躯干升起 → 肩炮上肩 → 羽翼/龙翼展开 → 头盔/龙首就位）
      // =====================================================
      const ADM_INK = '#2b2a29';
      const admWingTips = new Float32Array(6);   // 复用缓存，避免每帧新建数组
      const admTail = new Float32Array(14);
      const ADM_TAIL_SHIP = [-68, -2, -84, -6, -96, -16, -99, -30, -93, -42, -83, -46, -76, -40];
      const ADM_TAIL_MECH = [-6, -34, -24, -28, -44, -26, -62, -32, -76, -44, -84, -60, -86, -76];

      function admSeg(m, a, b) {
        const t = Math.max(0, Math.min(1, (m - a) / (b - a)));
        return t * t * (3 - 2 * t);
      }
      function admLerp(a, b, t) {
        return a + (b - a) * t;
      }
      // 确定性伪随机：闪电折线靠种子稳定抖动，不需要存数组
      function admRand(seed) {
        const s = Math.sin(seed * 12.9898 + 4.1414) * 43758.5453;
        return s - Math.floor(s);
      }
      function admBoltPath(x1, y1, x2, y2, segs, amp, seed) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        for (let i = 1; i < segs; i++) {
          const t = i / segs;
          const off = (admRand(seed + i * 7.31) - 0.5) * 2 * amp;
          ctx.lineTo(x1 + dx * t + nx * off, y1 + dy * t + ny * off);
        }
        ctx.lineTo(x2, y2);
      }
      // 手绘闪电：彩色粗线 + 白色电芯
      function admBolt(x1, y1, x2, y2, segs, amp, seed, color, w) {
        admBoltPath(x1, y1, x2, y2, segs, amp, seed);
        ctx.strokeStyle = color;
        ctx.lineWidth = w;
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = Math.max(1, w * 0.36);
        ctx.stroke();
      }
      // 四角星芒路径
      function admSparkle(x, y, r) {
        ctx.beginPath();
        ctx.moveTo(x, y - r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.quadraticCurveTo(x, y, x, y + r);
        ctx.quadraticCurveTo(x, y, x - r, y);
        ctx.quadraticCurveTo(x, y, x, y - r);
        ctx.closePath();
      }
      // 提督专属加宽海浪 + 浪尖闪光 + 船头白沫
      function admWaves(ship, glint) {
        const ws = Math.sin(frameCount * 0.14 + ship.bobPhase) * 4;
        ctx.strokeStyle = '#1c7ed6';
        ctx.lineWidth = 2.8;
        ctx.beginPath();
        for (let wx = -104; wx <= 92; wx += 16) {
          ctx.moveTo(wx + ws * 0.3, 25);
          ctx.quadraticCurveTo(wx + 8 + ws * 0.3, 18, wx + 16 + ws * 0.3, 25);
        }
        ctx.stroke();
        ctx.strokeStyle = glint;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let k = 0; k < 4; k++) {
          const gx = -84 + k * 52 + ws;
          ctx.moveTo(gx, 30);
          ctx.lineTo(gx + 11, 30);
        }
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#339af0';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(98, 21, 5.5 + Math.sin(frameCount * 0.25) * 1.4, 0, Math.PI * 2);
        ctx.moveTo(110, 18);
        ctx.arc(106, 18, 4, 0, Math.PI * 2);
        ctx.moveTo(92.5, 25);
        ctx.arc(89, 25, 3.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      // ---------- 圣金天穹·皇冠机甲 ----------
      function titanHullPath(half, open) {
        ctx.beginPath();
        if (half < 0) {
          ctx.moveTo(0, -3);
          ctx.lineTo(-68, -5);
          ctx.lineTo(-76, -15);
          ctx.lineTo(-92, -17);
          ctx.quadraticCurveTo(-96, 6, -78, 22);
          ctx.lineTo(0, 22);
        } else {
          ctx.moveTo(0, -3);
          ctx.lineTo(72, -5);
          ctx.quadraticCurveTo(92, -7, 102, -3);
          ctx.quadraticCurveTo(92, 14, 72, 22);
          ctx.lineTo(0, 22);
        }
        if (!open) ctx.closePath();
      }

      function drawAdmiralTitan(ship, m) {
        const PI = Math.PI;
        const t = frameCount + ship.bobPhase * 40;
        const sHull = admSeg(m, 0, 0.4);
        const sRise = admSeg(m, 0.12, 0.62);
        const sArm = admSeg(m, 0.3, 0.8);
        const sWing = admSeg(m, 0.3, 0.9);
        const aWing = Math.sqrt(sWing);   // 翼展角度先张开，避免中途被躯干挡住
        const sHead = admSeg(m, 0.5, 1);
        const hipY = admLerp(-3, -34, sRise);
        const torsoTop = admLerp(-26, -84, sRise);
        const headCY = admLerp(torsoTop - 6, torsoTop - 15, sHead);
        const gap = sHull * 12;
        const tilt = sHull * 0.1;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // 0. 海面圣光底座 + 旋转金色虚线法阵
        ctx.save();
        ctx.fillStyle = 'rgba(255, 224, 102, 0.22)';
        ctx.beginPath();
        ctx.ellipse(0, 22, 106 + m * 10, 15 + m * 4, 0, 0, PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fcc419';
        ctx.lineWidth = 2.4;
        ctx.setLineDash([10, 7]);
        ctx.lineDashOffset = -t * 0.6;
        ctx.beginPath();
        ctx.ellipse(0, 22, 98 + m * 14, 13 + m * 4, 0, 0, PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        // 1. 机甲背后旋转天穹圣光
        if (sWing > 0.02) {
          ctx.save();
          ctx.translate(0, headCY);
          ctx.rotate(t * 0.004);
          ctx.globalAlpha = 0.2 * sWing;
          ctx.fillStyle = '#ffe066';
          ctx.beginPath();
          for (let k = 0; k < 12; k++) {
            const a = (k * PI) / 6;
            const L = (k % 2 === 0 ? 165 : 120) * sWing;
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a - 0.07) * L, Math.sin(a - 0.07) * L);
            ctx.lineTo(Math.cos(a + 0.07) * L, Math.sin(a + 0.07) * L);
            ctx.closePath();
          }
          ctx.fill();
          ctx.restore();
        }

        // 2. 皇家紫金披风（机甲形态）
        if (sArm > 0.02) {
          const sw = Math.sin(t * 0.09) * 5 * sArm;
          ctx.save();
          ctx.globalAlpha = sArm;
          ctx.fillStyle = '#9c36b5';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(-22, torsoTop + 4);
          ctx.lineTo(22, torsoTop + 4);
          ctx.quadraticCurveTo(44 + sw, hipY, 40 + sw, 6);
          ctx.lineTo(-40 + sw, 6);
          ctx.quadraticCurveTo(-44 + sw, hipY, -22, torsoTop + 4);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = '#ffd43b';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.moveTo(-28, torsoTop + 10);
          ctx.quadraticCurveTo(-38 + sw, hipY, -35 + sw, 0);
          ctx.moveTo(28, torsoTop + 10);
          ctx.quadraticCurveTo(38 + sw, hipY, 35 + sw, 0);
          ctx.stroke();
          ctx.restore();
        }

        // 3. 六翼圣金羽翼（战舰形态折叠成船背金色鳍帆，变形时向上向外展开）
        const flap = Math.sin(t * 0.1) * 0.07 * sWing;
        for (let side = -1; side <= 1; side += 2) {
          const rx = side * admLerp(6, 20, aWing);
          const ry = admLerp(-20, torsoTop + 8, sWing);
          // 收拢时只画少量宽羽，避免叠成一团黑线
          const rows = sWing < 0.25 ? 1 : 2;
          const kStep = sWing < 0.25 ? 2 : 1;
          if (sWing < 0.1 && side < 0) continue;
          for (let row = 0; row < rows; row++) {
            for (let k = 5; k >= 0; k -= kStep) {
              const folded = PI + 0.1 + k * 0.11 + row * 0.03;
              const spread = side > 0 ? (2 * PI - 1.3 + k * 0.3) : (PI + 1.3 - k * 0.3);
              const a = admLerp(folded, spread, aWing) + side * flap * (1 + k * 0.2);
              const Lm = (row === 0 ? 1 : 0.64) * (58 + 42 * Math.sin(((k + 0.6) / 6) * PI));
              const L = admLerp(row === 0 ? 30 + k * 4 : 20 + k * 2, Lm, sWing);
              const w = admLerp(7, row === 0 ? 14 : 11, sWing);
              ctx.save();
              ctx.translate(rx, ry);
              ctx.rotate(a);
              ctx.fillStyle = row === 0
                ? (k % 2 === 0 ? '#ffd43b' : '#ffe066')
                : (k % 2 === 0 ? '#fff9db' : '#f3d9fa');
              ctx.strokeStyle = ADM_INK;
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(L * 0.45, -w, L, 0);
              ctx.quadraticCurveTo(L * 0.5, w * 0.7, 0, 0);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              if (sWing > 0.3) {
                ctx.strokeStyle = 'rgba(176, 125, 0, 0.6)';
                ctx.lineWidth = 1.2;
                ctx.beginPath();
                ctx.moveTo(4, 0);
                ctx.lineTo(L * 0.8, -w * 0.15);
                ctx.stroke();
              }
              ctx.restore();
            }
          }
        }

        // 4. 天穹圣环（战舰形态悬浮在穹顶上，机甲形态化作头后巨大圣轮）
        const haloCY = admLerp(torsoTop - 34, headCY, sHead);
        const haloRX = admLerp(15, 38, sHead);
        const haloRY = admLerp(4.5, 38, sHead);
        ctx.save();
        ctx.globalAlpha = 0.35;
        ctx.strokeStyle = '#fff3bf';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.ellipse(0, haloCY, haloRX, haloRY, 0, 0, PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 6.5;
        ctx.stroke();
        ctx.strokeStyle = '#ffd43b';
        ctx.lineWidth = 3.6;
        ctx.stroke();
        if (sHead > 0.3) {
          ctx.globalAlpha = sHead * 0.8;
          ctx.strokeStyle = '#ffe066';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          for (let k = 0; k < 12; k++) {
            const a = (k * PI) / 6 - t * 0.01;
            ctx.moveTo(Math.cos(a) * haloRX * 0.55, haloCY + Math.sin(a) * haloRY * 0.55);
            ctx.lineTo(Math.cos(a) * haloRX * 0.88, haloCY + Math.sin(a) * haloRY * 0.88);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#fff9db';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 1.6;
        const beadR = admLerp(1.8, 3.6, sHead);
        for (let k = 0; k < 8; k++) {
          const a = (k * PI) / 4 + t * 0.02;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * haloRX, haloCY + Math.sin(a) * haloRY, beadR, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();

        // 5. 圣铠双腿（从甲板中升起）
        if (sRise > 0.02) {
          for (let side = -1; side <= 1; side += 2) {
            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(side * 6, hipY);
            ctx.lineTo(side * 19, hipY);
            ctx.lineTo(side * 21, 0);
            ctx.lineTo(side * 9, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffd43b';
            ctx.beginPath();
            ctx.arc(side * 14, hipY * 0.5, 4.5 * sRise, 0, PI * 2);
            ctx.fill();
            ctx.stroke();
          }
        }

        // 6. 白金圣舰舰体（变形时从中线裂开，化作 V 字悬浮踏浪甲板）
        if (sHull > 0.05) {
          ctx.save();
          ctx.globalAlpha = Math.min(1, sHull * 1.5) * (0.65 + Math.sin(t * 0.3) * 0.2);
          ctx.fillStyle = '#fff3bf';
          ctx.fillRect(-gap - 2, -6, gap * 2 + 4, 28);
          ctx.restore();
        }
        for (let half = -1; half <= 1; half += 2) {
          ctx.save();
          ctx.translate(half * gap, sHull * 3);
          ctx.rotate(-half * tilt);
          ctx.fillStyle = '#fffdf3';
          titanHullPath(half);
          ctx.fill();
          ctx.save();
          ctx.clip();
          ctx.fillStyle = '#9c36b5';
          ctx.fillRect(half < 0 ? -104 : -2, 14, 106, 10);
          ctx.fillStyle = '#ffd43b';
          ctx.fillRect(half < 0 ? -104 : -2, 3, 106, 3.5);
          ctx.restore();
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.8;
          titanHullPath(half, sHull < 0.25);   // 未裂开时不描中缝，避免像一根桅杆
          ctx.stroke();
          // 鎏金舷窗
          ctx.fillStyle = '#ffe066';
          ctx.lineWidth = 1.6;
          for (let k = 0; k < 5; k++) {
            ctx.beginPath();
            ctx.arc(half * (12 + k * 13), 10, 2.6, 0, PI * 2);
            ctx.fill();
            ctx.stroke();
          }
          if (half > 0) {
            // 船首鎏金太阳撞角
            ctx.fillStyle = '#ffd43b';
            ctx.lineWidth = 2;
            admSparkle(99, -3, 10 + Math.sin(t * 0.12) * 1.5);
            ctx.fill();
            ctx.stroke();
          } else if (sHull < 0.95) {
            // 船尾紫金王旗（战舰形态）
            const fw = Math.sin(t * 0.25) * 4;
            ctx.globalAlpha = 1 - sHull;
            ctx.strokeStyle = ADM_INK;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            ctx.moveTo(-84, -16);
            ctx.lineTo(-84, -54);
            ctx.stroke();
            ctx.fillStyle = '#ae3ec9';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-84, -54);
            ctx.quadraticCurveTo(-98, -56 + fw, -114, -49 + fw * 0.6);
            ctx.lineTo(-104, -45 + fw * 0.5);
            ctx.quadraticCurveTo(-96, -42 + fw * 0.4, -84, -40);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#ffd43b';
            admSparkle(-95, -48 + fw * 0.5, 4);
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.restore();
        }

        // 7. 圣铠躯干（战舰形态是白金大教堂舰桥）
        const sw = admLerp(14, 25, sRise);
        const ww = admLerp(16, 14, sRise);
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(-ww, hipY);
        ctx.lineTo(ww, hipY);
        ctx.lineTo(sw + 3, torsoTop + 9);
        ctx.lineTo(sw, torsoTop);
        ctx.lineTo(-sw, torsoTop);
        ctx.lineTo(-sw - 3, torsoTop + 9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#fcc419';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-sw + 3, torsoTop + 4);
        ctx.lineTo(0, torsoTop + (hipY - torsoTop) * 0.62);
        ctx.lineTo(sw - 3, torsoTop + 4);
        ctx.stroke();
        if (sRise < 0.9) {
          ctx.globalAlpha = 1 - sRise;
          ctx.fillStyle = '#66d9e8';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.5;
          for (let k = -1; k <= 1; k += 2) {
            ctx.beginPath();
            ctx.roundRect(k * 10.5 - 2, torsoTop + 10, 4, 8, [2, 2, 0, 0]);
            ctx.fill();
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }
        if (sRise > 0.3) {
          ctx.globalAlpha = sRise;
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(-8, hipY - 12);
          ctx.lineTo(8, hipY - 12);
          ctx.moveTo(-7, hipY - 6.5);
          ctx.lineTo(7, hipY - 6.5);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = '#ffd43b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(-ww - 1, hipY - 3, ww * 2 + 2, 6, 2);
        ctx.fill();
        ctx.stroke();
        // 胸口天穹核心（金色菱框 + 青色圣光宝石）
        const coreY = torsoTop + admLerp(11, 19, sRise);
        const coreR = admLerp(3.5, 8, sRise) * (1 + Math.sin(t * 0.15) * 0.08);
        ctx.fillStyle = '#ffd43b';
        ctx.beginPath();
        ctx.moveTo(0, coreY - coreR - 5);
        ctx.lineTo(coreR + 5, coreY);
        ctx.lineTo(0, coreY + coreR + 5);
        ctx.lineTo(-coreR - 5, coreY);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.save();
        ctx.shadowColor = '#3bc9db';
        ctx.shadowBlur = 8 + m * 10;
        ctx.fillStyle = '#66d9e8';
        ctx.beginPath();
        ctx.arc(0, coreY, coreR, 0, PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-coreR * 0.35, coreY - coreR * 0.35, coreR * 0.3, 0, PI * 2);
        ctx.fill();

        // 8. 圣骑士头盔（战舰形态是舰桥穹顶）
        const hw = admLerp(24, 26, sHead);
        const hh = admLerp(13, 24, sHead);
        const hTop = headCY - hh / 2;
        const hBot = headCY + hh / 2;
        ctx.fillStyle = '#fff9db';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-hw / 2, hBot);
        ctx.lineTo(-hw / 2, hTop + 5);
        ctx.quadraticCurveTo(-hw / 2, hTop - 2, 0, hTop - 4);
        ctx.quadraticCurveTo(hw / 2, hTop - 2, hw / 2, hTop + 5);
        ctx.lineTo(hw / 2, hBot);
        ctx.lineTo(hw * 0.25, hBot + 5 * sHead);
        ctx.lineTo(-hw * 0.25, hBot + 5 * sHead);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        if (sHead > 0.05) {
          ctx.fillStyle = '#ffd43b';
          ctx.lineWidth = 2;
          for (let side = -1; side <= 1; side += 2) {
            ctx.beginPath();
            ctx.moveTo(side * hw / 2, headCY + 3);
            ctx.lineTo(side * (hw / 2 + 12 * sHead), headCY - 14 * sHead);
            ctx.lineTo(side * (hw / 2 + 4 * sHead), headCY - 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
          ctx.save();
          ctx.globalAlpha = sHead;
          ctx.fillStyle = '#22d3ee';
          ctx.shadowColor = '#22d3ee';
          ctx.shadowBlur = 8;
          ctx.fillRect(-hw * 0.36, headCY - 3, hw * 0.72, 4.5);
          ctx.fillRect(-1.8, headCY - 3, 3.6, 10);
          ctx.restore();
        }
        if (sHead < 0.95) {
          ctx.globalAlpha = 1 - sHead;
          ctx.fillStyle = '#66d9e8';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(0, headCY + 1, 3.5, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
        // 圣金皇冠
        const cw = admLerp(16, 28, sHead);
        const ch = admLerp(9, 17, sHead);
        const cb = hTop - 2;
        ctx.fillStyle = '#ffd43b';
        ctx.strokeStyle = ADM_INK;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-cw / 2, cb + 2);
        ctx.lineTo(-cw / 2 - 2, cb - ch * 0.75);
        ctx.lineTo(-cw * 0.25, cb - ch * 0.4);
        ctx.lineTo(0, cb - ch);
        ctx.lineTo(cw * 0.25, cb - ch * 0.4);
        ctx.lineTo(cw / 2 + 2, cb - ch * 0.75);
        ctx.lineTo(cw / 2, cb + 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ae3ec9';
        ctx.beginPath();
        ctx.arc(0, cb - ch * 0.2, admLerp(2, 3.4, sHead), 0, PI * 2);
        ctx.fill();
        ctx.fillStyle = '#66d9e8';
        ctx.beginPath();
        ctx.arc(-cw * 0.3, cb - 1, 1.8, 0, PI * 2);
        ctx.moveTo(cw * 0.3 + 1.8, cb - 1);
        ctx.arc(cw * 0.3, cb - 1, 1.8, 0, PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff9db';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(0, cb - ch - 2, 2.4, 0, PI * 2);
        ctx.fill();
        ctx.stroke();

        // 9. 双联圣炮塔（战舰形态是前后主炮塔，变形时飞上双肩化作肩甲 + 臂炮）
        for (let side = -1; side <= 1; side += 2) {
          const px = admLerp(side * 46, side * 30, sArm) + side * gap * (1 - sArm);
          const py = admLerp(-6, torsoTop + 4, sArm);
          const pr = admLerp(9, 15, sArm);
          const ang = side > 0 ? admLerp(0, 0.75, sArm) : admLerp(PI, PI - 0.75, sArm);
          const BL = admLerp(18, 36, sArm);
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(ang);
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2;
          if (sArm > 0.05) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(2, -8 * sArm, 14, 16 * sArm, 4);
            ctx.fill();
            ctx.stroke();
          }
          ctx.fillStyle = '#e9ecef';
          ctx.beginPath();
          ctx.roundRect(4, -6.5, BL, 5, 2);
          ctx.fill();
          ctx.stroke();
          ctx.beginPath();
          ctx.roundRect(4, 1.5, BL, 5, 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#ffd43b';
          ctx.beginPath();
          ctx.roundRect(BL, -8, 6, 16, 2);
          ctx.fill();
          ctx.stroke();
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = '#fff3bf';
          ctx.beginPath();
          ctx.arc(BL + 9, 0, 2.5 + m * 2.5 + Math.sin(t * 0.2 + side) * 1, 0, PI * 2);
          ctx.fill();
          ctx.restore();
          // 肩甲 / 炮塔罩
          ctx.fillStyle = '#ffd43b';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(px, py, pr, PI, 0);
          ctx.quadraticCurveTo(px + pr, py + pr * 0.6, px, py + pr * admLerp(0.35, 0.8, sArm));
          ctx.quadraticCurveTo(px - pr, py + pr * 0.6, px - pr, py);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.strokeStyle = '#fff9db';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.arc(px, py, pr * 0.62, PI * 1.1, PI * 1.9);
          ctx.stroke();
          ctx.fillStyle = '#ae3ec9';
          ctx.strokeStyle = ADM_INK;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(px, py + pr * 0.15, pr * 0.22, 0, PI * 2);
          ctx.fill();
          ctx.stroke();
        }

        // 10. 漂浮圣光星屑（机甲形态）
        if (sWing > 0.05) {
          ctx.fillStyle = '#fff3bf';
          ctx.strokeStyle = '#f59f00';
          ctx.lineWidth = 1.3;
          for (let k = 0; k < 7; k++) {
            const a = k * 0.9 + t * 0.008;
            const r = (3 + 2.5 * Math.abs(Math.sin(t * 0.07 + k * 1.7))) * sWing;
            admSparkle(Math.cos(a) * 108, -64 + Math.sin(a) * 74, r);
            ctx.fill();
            ctx.stroke();
          }
        }

        // 11. 变形过程中的金色能量环
        const pulse = Math.sin(m * PI);
        if (pulse > 0.08) {
          ctx.save();
          ctx.globalAlpha = pulse * 0.85;
          ctx.strokeStyle = '#ffd43b';
          ctx.lineWidth = 3;
          ctx.setLineDash([12, 8]);
          ctx.lineDashOffset = t * 1.5;
          ctx.beginPath();
          ctx.ellipse(0, -46, 50 + m * 70, 26 + m * 64, 0, 0, PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(0, -46, 36 + m * 52, 18 + m * 46, 0, 0, PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        admWaves(ship, '#ffd43b');
      }

      // ---------- 紫霄雷龙·帝皇机甲 ----------
      function dragonHullPath(half, open) {
        ctx.beginPath();
        if (half < 0) {
          ctx.moveTo(0, -3);
          ctx.lineTo(-62, -6);
          ctx.lineTo(-74, -16);
          ctx.lineTo(-90, -12);
          ctx.quadraticCurveTo(-94, 6, -76, 22);
          ctx.lineTo(0, 22);
        } else {
          ctx.moveTo(0, -3);
          ctx.lineTo(66, -6);
          ctx.lineTo(82, -12);
          ctx.quadraticCurveTo(100, 2, 74, 22);
          ctx.lineTo(0, 22);
        }
        if (!open) ctx.closePath();
      }

      // 侧面朝右（船头方向）的雷龙头，原点在后脑
      function drawDragonHead(jaw, glow, skull) {
        const PI = Math.PI;
        ctx.strokeStyle = ADM_INK;
        // 背后双金角
        ctx.fillStyle = '#ffd43b';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-2, -10);
        ctx.quadraticCurveTo(-16, -26, -34, -28);
        ctx.quadraticCurveTo(-20, -18, -12, -2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(-8, -4);
        ctx.quadraticCurveTo(-22, -12, -32, -8);
        ctx.quadraticCurveTo(-22, -4, -14, 4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        // 口中雷光
        if (glow > 0.05) {
          ctx.save();
          ctx.globalAlpha = glow;
          ctx.fillStyle = '#f783ac';
          ctx.beginPath();
          ctx.ellipse(12, 7, 12, 3 + jaw * 12, 0, 0, PI * 2);

        }
        // 下颚（随咆哮张合）
        ctx.save();
        ctx.translate(-6, 6);

        ctx.fillStyle = '#2b1345';
        ctx.lineWidth = 2.2;
        ctx.beginPath();

        ctx.lineTo(30, 0);
        ctx.lineTo(25, 5);
        ctx.lineTo(0, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (let k = 0; k < 3; k++) {

        // 头骨
