<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>涂鸦虫虫大作战 ✏️🐛</title>
  <style>
    :root {
      --paper: #fdfbf2;
      --grid: rgba(125, 165, 210, 0.22);
      --margin-red: rgba(235, 110, 110, 0.38);
      --ink: #2b2a29;
      --pencil: #5b5750;
      --green: #7ed957;
      --green-dark: #4f9e2f;
      --red: #ff6b6b;
      --red-dark: #d63c3c;
      --yellow: #ffe066;
      --blue: #74c0fc;
      --purple: #d0bfff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", cursive, sans-serif;
      color: var(--ink);
    }

    /* 模拟直播间背景图层（OBS 模式下自动隐藏保持纯透明） */
    .live-preview-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #121214 url('./live-bg.jpg') center center / cover no-repeat;
      pointer-events: none;
    }

    body.obs-mode .live-preview-bg,
    body.transparent-bg .live-preview-bg {
      display: none !important;
    }

    /* 主画布（完全透明背景，纯展示层不响应鼠标） */
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      pointer-events: none;
    }

    /* 顶部便利贴 HUD */
    .hud-top {
      position: fixed;
      top: 14px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .title-card {
      pointer-events: auto;
      background: var(--yellow);
      border: 3px solid var(--ink);
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      padding: 8px 16px;
      box-shadow: 4px 5px 0 var(--ink);
      transform: rotate(-1.5deg);
      position: relative;
    }

    .title-card::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      width: 54px;
      height: 16px;
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px dashed rgba(43, 42, 41, 0.35);
    }

    .title-card h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 1px;
    }

    .title-card .sub {
      font-size: 12px;
      color: var(--pencil);
      margin-top: 2px;
    }

    .stats-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .sticky-stat {
      background: #fff;
      border: 2.5px solid var(--ink);
      border-radius: 18px 220px 20px 200px / 200px 20px 220px 18px;
      padding: 6px 14px;
      box-shadow: 3px 4px 0 var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 15px;
      transform: rotate(1deg);
      transition: transform 0.12s ease;
    }

    .sticky-stat:nth-child(2) {
      background: #ffe3e3;
      transform: rotate(-1.2deg);
    }

    .sticky-stat:nth-child(3) {
      background: #e7f5ff;
      transform: rotate(0.8deg);
    }

    .sticky-stat.bump {
      transform: scale(1.16) rotate(-2deg);
    }

    .sound-btn {
      background: #fff9db;
      border: 2.5px solid var(--ink);
      border-radius: 50% 45% 55% 48% / 48% 55% 45% 50%;
      width: 42px;
      height: 42px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .sound-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    /* 中央俏皮提示气泡 */
    .toast-bubble {
      position: fixed;
      top: 96px;
      left: 50%;
      transform: translateX(-50%) scale(0.85) rotate(-1deg);
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 24px 18px 28px 16px / 18px 26px 16px 24px;
      padding: 8px 18px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 4px 4px 0 var(--ink);
      opacity: 0;
      pointer-events: none;
      z-index: 15;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      white-space: nowrap;
    }

    .toast-bubble.show {
      opacity: 1;
      transform: translateX(-50%) scale(1) rotate(-1deg);
    }

    /* 底部手绘控制栏 */
    .controls-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
      width: calc(100% - 32px);
      max-width: 780px;
      pointer-events: none;
    }

    .weapon-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.92);
      border: 2.5px solid var(--ink);
      border-radius: 255px 25px 225px 25px / 25px 225px 25px 255px;
      padding: 5px 10px;
      box-shadow: 3px 3px 0 var(--ink);
      transform: rotate(0.6deg);
    }

    .weapon-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--pencil);
      padding: 0 4px;
    }

    .weapon-chip {
      border: 2px solid transparent;
      background: transparent;
      border-radius: 16px 20px 14px 18px;
      padding: 5px 11px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .weapon-chip:hover {
      background: #f1efe6;
    }

    .weapon-chip.active {
      background: var(--yellow);
      border-color: var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
      transform: rotate(-1.5deg);
    }

    .main-buttons {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }

    .doodle-btn {
      position: relative;
      border: 3.5px solid var(--ink);
      border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
      padding: 13px 26px;
      font-family: inherit;
      font-size: 19px;
      font-weight: 900;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 5px 6px 0 var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s ease, filter 0.1s ease;
    }

    .doodle-btn:hover {
      transform: translateY(-2px) rotate(-1deg);
      box-shadow: 6px 8px 0 var(--ink);
    }

    .doodle-btn:active {
      transform: translate(4px, 5px) scale(0.97);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .btn-summon {
      background: var(--green);
      transform: rotate(-1.2deg);
    }

    .btn-swarm {
      background: var(--blue);
      padding: 11px 16px;
      font-size: 15px;
      transform: rotate(1.5deg);
    }

    .btn-kill {
      background: var(--red);
      color: #fff;
      text-shadow: 1.5px 1.5px 0 var(--ink);
      transform: rotate(1.1deg);
    }

    .btn-kill:hover {
      transform: translateY(-2px) rotate(1.8deg);
    }

    .btn-ship {
      background: linear-gradient(135deg, #1971c2 0%, #3bc9db 55%, #fcc419 100%);
      color: #fff;
      text-shadow: 1.5px 1.5px 0 var(--ink);
      transform: rotate(-0.9deg);
      box-shadow: 5px 6px 0 var(--ink), 0 0 14px rgba(25, 113, 194, 0.35);
    }

    .btn-ship:hover {
      transform: translateY(-2px) rotate(-1.8deg) scale(1.03);
      box-shadow: 6px 8px 0 var(--ink), 0 0 22px rgba(252, 196, 25, 0.55);
    }

    .btn-box {
      background: linear-gradient(135deg, #ff6b9d 0%, #ffa94d 100%);
      color: #fff;
      text-shadow: 1.5px 1.5px 0 var(--ink);
      transform: rotate(0.9deg);
      box-shadow: 5px 6px 0 var(--ink), 0 0 14px rgba(255, 107, 157, 0.45);
    }

    .btn-box:hover {
      transform: translateY(-2px) rotate(1.8deg) scale(1.03);
      box-shadow: 6px 8px 0 var(--ink), 0 0 22px rgba(255, 169, 77, 0.6);
    }

    .btn-admiral {
      background: linear-gradient(135deg, #ffd43b 0%, #f59f00 45%, #ae3ec9 100%);
      color: #fff;
      text-shadow: 1.5px 1.5px 0 var(--ink);
      transform: rotate(-1.3deg);
      box-shadow: 5px 6px 0 var(--ink), 0 0 18px rgba(255, 212, 59, 0.65);
    }

    .btn-admiral:hover {
      transform: translateY(-2px) rotate(-2deg) scale(1.04);
      box-shadow: 6px 8px 0 var(--ink), 0 0 26px rgba(174, 62, 201, 0.75);
    }

    /* 心动盲盒手绘宝箱与纸条弹窗 */
    .chest-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .chest-overlay.active {
      opacity: 1;
    }

    .chest-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .chest-rays {
      position: absolute;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255, 224, 102, 0.42) 0deg 15deg,
        transparent 15deg 30deg
      );
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .chest-overlay.opened .chest-rays {
      opacity: 1;
      transform: scale(1.1);
      animation: spinRays 10s linear infinite;
    }

    @keyframes spinRays {
      from { transform: scale(1.1) rotate(0deg); }
      to { transform: scale(1.1) rotate(360deg); }
    }

    .chest-svg-wrap {
      position: relative;
      width: 170px;
      height: 150px;
      transform: translateY(-60px) scale(0.4);
      opacity: 0;
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
      filter: drop-shadow(5px 7px 0 rgba(43, 42, 41, 0.28));
    }

    .chest-overlay.dropping .chest-svg-wrap,
    .chest-overlay.shaking .chest-svg-wrap,
    .chest-overlay.opened .chest-svg-wrap {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .chest-overlay.shaking .chest-svg-wrap {
      animation: chestShake 0.45s ease-in-out infinite;
    }

    .chest-overlay.opened .chest-svg-wrap {
      transform: translateY(48px) scale(0.88);
    }

    @keyframes chestShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-9deg) scale(1.06, 0.94); }
      40% { transform: rotate(9deg) scale(0.95, 1.06); }
      60% { transform: rotate(-7deg) scale(1.05, 0.96); }
      80% { transform: rotate(7deg) scale(0.97, 1.04); }
    }

    .chest-lid {
      transform-origin: 24px 66px;
      transition: transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .chest-overlay.opened .chest-lid {
      transform: rotate(-52deg) translate(-12px, -14px);
    }

    .chest-glow {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .chest-overlay.opened .chest-glow {
      opacity: 1;
    }

    /* 弹出的手绘纸条 */
    .note-paper {
      position: absolute;
      bottom: 84px;
      min-width: 280px;
      max-width: min(86vw, 440px);
      background: #fffdf0;
      background-image: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 27px,
        rgba(125, 165, 210, 0.22) 27px,
        rgba(125, 165, 210, 0.22) 28px
      );
      border: 3.5px solid var(--ink);
      border-radius: 18px 220px 22px 200px / 200px 22px 220px 18px;
      padding: 22px 28px 18px;
      box-shadow: 7px 9px 0 var(--ink);
      text-align: center;
      transform: translateY(70px) scale(0.2) rotate(-6deg);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.48s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }

    .chest-overlay.opened .note-paper {
      transform: translateY(-28px) scale(1) rotate(-1.5deg);
      opacity: 1;
    }

    /* 纸条顶部半透明手绘胶带 */
    .note-paper::before {
      content: "";
      position: absolute;
      top: -13px;
      left: 50%;
      transform: translateX(-50%) rotate(2deg);
      width: 78px;
      height: 22px;
      background: rgba(255, 182, 193, 0.72);
      border: 2px dashed rgba(43, 42, 41, 0.4);
    }

    .note-badge {
      display: inline-block;
      background: #ffe3e3;
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #c92a2a;
      margin-bottom: 10px;
      box-shadow: 2px 2px 0 var(--ink);
    }

    .note-text {
      font-size: 28px;
      font-weight: 900;
      line-height: 1.35;
      color: var(--ink);
      margin: 6px 0 12px;
      word-break: break-word;
      text-shadow: 1px 1px 0 rgba(255, 224, 102, 0.8);
    }

    .note-footer {
      font-size: 12px;
      color: var(--pencil);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .hint-tag {
      font-size: 12px;
      color: var(--pencil);
      background: rgba(255, 255, 255, 0.75);
      border: 1.5px dashed rgba(43, 42, 41, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .hud-top {
        left: 14px;
        right: 14px;
        top: 10px;
      }
      .title-card h1 {
        font-size: 16px;
      }
      .title-card .sub {
        display: none;
      }
      .sticky-stat {
        font-size: 13px;
        padding: 4px 10px;
      }
      .doodle-btn {
        padding: 11px 18px;
        font-size: 16px;
      }
      .btn-swarm {
        padding: 10px 12px;
        font-size: 13px;
      }
      .weapon-label {
        display: none;
      }
    }

    /* OBS 直播透明叠加纯净模式 */
    body.obs-mode .controls-dock {
      display: none !important;
    }
    body.hide-hud .hud-top {
      display: none !important;
    }
  </style>
</head>
<body class="obs-mode hide-hud">
  <div class="live-preview-bg" aria-hidden="true"></div>
  <canvas id="gameCanvas"></canvas>

  <!-- 顶部 HUD -->
  <header class="hud-top">
    <div class="title-card">
      <h1>✏️ 涂鸦虫虫大作战</h1>
      <div class="sub">直播间礼物互动叠加层 · 送礼自动触发</div>
    </div>

    <div class="stats-group">
      <div class="sticky-stat" id="statBugs">🐛 场上: <span id="bugCount">0</span></div>
      <div class="sticky-stat" id="statKilled">💥 消灭: <span id="killCount">0</span></div>
      <div class="sticky-stat" id="statScore">⭐ 得分: <span id="scoreCount">0</span></div>
      <button class="sound-btn" id="bgToggle" title="切换模拟直播间背景 / 纯透明背景">🖼️</button>
      <button class="sound-btn" id="soundToggle" title="切换音效">🔊</button>
    </div>
  </header>

  <div class="toast-bubble" id="toast"></div>

  <!-- 心动盲盒手绘宝箱与纸条弹窗 -->
  <div class="chest-overlay" id="chestOverlay" aria-live="polite">
    <div class="chest-stage" id="chestStage">
      <div class="chest-rays"></div>

      <div class="note-paper" id="notePaper">
        <div class="note-badge" id="noteBadge">💖 心动盲盒</div>
        <div class="note-text" id="noteText">撒娇八连卡(可指定)</div>
      </div>

      <div class="chest-svg-wrap">
        <svg viewBox="0 0 180 155" width="170" height="150" xmlns="http://www.w3.org/2000/svg">
          <!-- 箱内金光 -->
          <ellipse class="chest-glow" cx="90" cy="68" rx="64" ry="26" fill="#ffe066" opacity="0.85"/>
          <!-- 宝箱底座 -->
          <rect x="24" y="66" width="132" height="72" rx="12" fill="#a05a2c" stroke="#2b2a29" stroke-width="5" stroke-linejoin="round"/>
          <!-- 木板纹路 -->
          <line x1="27" y1="90" x2="153" y2="90" stroke="#733d1b" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="27" y1="114" x2="153" y2="114" stroke="#733d1b" stroke-width="3.5" stroke-linecap="round"/>
          <!-- 鎏金竖条铁箍 -->
          <rect x="44" y="66" width="14" height="72" fill="#ffd43b" stroke="#2b2a29" stroke-width="4"/>
          <rect x="122" y="66" width="14" height="72" fill="#ffd43b" stroke="#2b2a29" stroke-width="4"/>
          <!-- 宝箱盖子（会向上掀开） -->
          <g class="chest-lid">
            <path d="M20 68 Q20 26 90 26 Q160 26 160 68 Z" fill="#b86b35" stroke="#2b2a29" stroke-width="5" stroke-linejoin="round"/>
            <path d="M44 68 L44 33 Q51 31 58 30 L58 68 Z" fill="#ffd43b" stroke="#2b2a29" stroke-width="4"/>
            <path d="M122 68 L122 30 Q129 31 136 33 L136 68 Z" fill="#ffd43b" stroke="#2b2a29" stroke-width="4"/>
            <rect x="18" y="60" width="144" height="12" rx="5" fill="#ffd43b" stroke="#2b2a29" stroke-width="4"/>
          </g>
          <!-- 爱心红宝石锁扣 -->
          <path d="M90 88 C90 88 73 77 73 66 C73 59 79 55 85 58 C88 60 90 63 90 63 C90 63 92 60 95 58 C101 55 107 59 107 66 C107 77 90 88 90 88 Z" fill="#ff6b9d" stroke="#2b2a29" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="83" cy="64" r="2.5" fill="#fff"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- 底部操作台 -->
  <footer class="controls-dock">
    <div class="weapon-bar" role="radiogroup" aria-label="选择杀虫工具">
      <span class="weapon-label">杀虫道具:</span>
      <button class="weapon-chip active" data-weapon="swatter">🩴 苍蝇拍</button>
      <button class="weapon-chip" data-weapon="spray">🧴 毒气喷雾</button>
      <button class="weapon-chip" data-weapon="eraser">🧽 大橡皮</button>
    </div>

    <div class="main-buttons">
      <button class="doodle-btn btn-summon" id="btnSummon">
        <span>🐛</span> 召唤虫子
      </button>
      <button class="doodle-btn btn-swarm" id="btnSwarm" title="一次召唤 8 只虫子">
        <span>⚡</span> 虫潮 +8
      </button>
      <button class="doodle-btn btn-ship" id="btnShip" title="召唤手绘大航海战舰乘风破浪开炮灭虫">
        <span>⛵</span> 召唤战舰
      </button>
      <button class="doodle-btn btn-ship" id="btnGuard" title="模拟新上舰长：守护战舰自动攻击 30 分钟">
        <span>🛡️</span> 新舰长
      </button>
      <button class="doodle-btn btn-box" id="btnGift" title="模拟随机付费礼物：不掉虫子，有概率变成杀虫剂">
        <span>🎲</span> 随机礼物
      </button>
      <button class="doodle-btn btn-admiral" id="btnAdmiral" title="模拟提督专属：召唤可变形尊贵机甲战舰">
        <span>👑</span> 提督机甲
      </button>
      <button class="doodle-btn btn-box" id="btnBlindBox" title="模拟送出心动盲盒，自动开宝箱抽纸条">
        <span>🎁</span> 心动盲盒
      </button>
      <button class="doodle-btn btn-kill" id="btnKill">
        <span>💥</span> 杀虫！
      </button>
    </div>

    <div class="hint-tag">🔧 本地调试模拟面板（OBS 叠加 ?obs=1&hud=0 自动隐藏，正式版仅礼物触发）</div>
  </footer>

  <script>
    (() => {
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      // 默认即为 OBS 全透明纯净模式（无背景、无按钮、无计分板）；仅 ?debug=1 开启本地调试面板
      const urlParams = new URLSearchParams(window.location.search);
      const isDebugMode = urlParams.get('debug') === '1';
      const isObsMode = !isDebugMode;

      // 简易手绘音效合成 (Web Audio)
      // ============================
      let soundEnabled = true;
      let audioCtx = null;

      function ensureAudio() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) audioCtx = new AC();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playPopSound(pitchOffset = 0) {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = 'triangle';
        const base = 320 + pitchOffset * 40 + Math.random() * 80;
        osc.frequency.setValueAtTime(base, now);
        osc.frequency.exponentialRampToValueAtTime(base * 2.1, now + 0.09);
        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
        osc.connect(gain).connect(ac.destination);
        osc.start(now);
        osc.stop(now + 0.12);
      }

      function playSquashSound(combo = 1) {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;

        // 啪嗒声 (白噪声短脉冲)
        const bufferSize = ac.sampleRate * 0.08;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;

        const filter = ac.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(900 + Math.min(combo, 10) * 80, now);

        const gain = ac.createGain();
        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

        noise.connect(filter).connect(gain).connect(ac.destination);
        noise.start(now);

        // 卡通弹跳音
        const osc = ac.createOscillator();
        const oGain = ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220 + Math.min(combo, 8) * 35, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.11);
        oGain.gain.setValueAtTime(0.18, now);
        oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.connect(oGain).connect(ac.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }

      function playSpraySound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        const bufferSize = ac.sampleRate * 0.45;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;

        const filter = ac.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(2200, now);

        const gain = ac.createGain();
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.45);

        noise.connect(filter).connect(gain).connect(ac.destination);
        noise.start(now);
      }

      function playEraserSound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        const bufferSize = ac.sampleRate * 0.55;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const wave = Math.abs(Math.sin(t * Math.PI * 5));
          data[i] = (Math.random() * 2 - 1) * wave * (1 - t * 0.4);
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;

        const filter = ac.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(650, now);
        filter.Q.setValueAtTime(1.5, now);

        const gain = ac.createGain();
        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.005, now + 0.55);

        noise.connect(filter).connect(gain).connect(ac.destination);
        noise.start(now);
      }

      function playHornSound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;

        // 浑厚霸气的大航海汽笛/号角声
        const freqs = [146.8, 220, 293.7];
        freqs.forEach((f, idx) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = idx === 0 ? 'sawtooth' : 'triangle';
          osc.frequency.setValueAtTime(f * 0.96, now);
          osc.frequency.linearRampToValueAtTime(f, now + 0.12);
          osc.frequency.setValueAtTime(f, now + 0.42);
          osc.frequency.exponentialRampToValueAtTime(f * 0.92, now + 0.65);

          const filter = ac.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(900, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(idx === 0 ? 0.12 : 0.08, now + 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.68);

          osc.connect(filter).connect(gain).connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.7);
        });

        // 破浪水花声
        const bufferSize = ac.sampleRate * 0.4;
        const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.sin((i / bufferSize) * Math.PI);
        }
        const noise = ac.createBufferSource();
        noise.buffer = buffer;
        const nFilter = ac.createBiquadFilter();
        nFilter.type = 'bandpass';
        nFilter.frequency.setValueAtTime(1100, now);
        const nGain = ac.createGain();
        nGain.gain.setValueAtTime(0.14, now);
        nGain.gain.exponentialRampToValueAtTime(0.005, now + 0.4);
        noise.connect(nFilter).connect(nGain).connect(ac.destination);
        noise.start(now);
      }

      function playCannonSound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;

        // 加农炮低音轰鸣
        const osc = ac.createOscillator();
        const oGain = ac.createGain();

        osc.frequency.setValueAtTime(150, now);

      function playUltimateSound(kind) {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;

        if (kind === 'tempest') {
          // 震撼雷鸣 + 闪电噼啪声
          const bufferSize = ac.sampleRate * 0.65;
          const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const t = i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 1.5);
          }
          const noise = ac.createBufferSource();
          noise.buffer = buffer;
          const filter = ac.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2400, now);
          filter.frequency.exponentialRampToValueAtTime(180, now + 0.6);
          const gain = ac.createGain();
          gain.gain.setValueAtTime(0.32, now);
          gain.gain.exponentialRampToValueAtTime(0.005, now + 0.65);
          noise.connect(filter).connect(gain).connect(ac.destination);
          noise.start(now);
        } else if (kind === 'maelstrom') {
          // 深海怒涛旋转呼啸
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(75, now + 0.75);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.002, now + 0.78);
          osc.connect(gain).connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.8);
        } else if (kind === 'kraken') {
          // 深海巨怪低沉咆哮
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(115, now);
          osc.frequency.exponentialRampToValueAtTime(52, now + 0.55);
          const filter = ac.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(420, now);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.002, now + 0.58);
          osc.connect(filter).connect(gain).connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        } else {
          playCannonSound();
        }
      }

      function playTransformSound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        // 尊贵机甲机械齿轮变形 + 能量充能和弦
        const steps = [180, 270, 420, 640, 880];
        steps.forEach((freq, idx) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
          const t = now + idx * 0.055;
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.25, t + 0.09);
          const filter = ac.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(2200, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.14, t + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          osc.connect(filter).connect(gain).connect(ac.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        });
      }

      function pickBugType() {
        const total = BUG_TYPES.reduce((s, b) => s + b.weight, 0);
        let r = Math.random() * total;
        for (const t of BUG_TYPES) {
          r -= t.weight;
          if (r <= 0) return t;
        }
        return BUG_TYPES[0];
      }

      function safeSpawnPos() {
        const padX = Math.max(85, width * 0.1);
        const padTop = 105;
        const padBottom = 165;
        return {
          x: padX + Math.random() * Math.max(40, width - padX * 2),
          y: padTop + Math.random() * Math.max(40, height - padTop - padBottom)
        };
      }

      function spawnBug(x, y, forceTypeId) {
        if (bugs.length >= MAX_BUGS) {
          return false;
        }
        const type = (forceTypeId && BUG_TYPES.find((t) => t.id === forceTypeId)) || pickBugType();
        const pos = (x != null && y != null) ? { x, y } : safeSpawnPos();
        const angle = Math.random() * Math.PI * 2;
        const butterflyColors = ['#f783ac', '#74c0fc', '#ffd43b', '#da77f2', '#ff922b'];
        const bug = {
          id: Math.random().toString(36).slice(2),
          type,
          x: pos.x,
          y: pos.y,
          vx: Math.cos(angle) * type.speed,
          vy: Math.sin(angle) * type.speed,
          angle,
          targetAngle: angle,
          speedFactor: 0.85 + Math.random() * 0.35, // 同种虫子也有个体快慢差异
          turnTimer: 30 + Math.random() * 80,
          behaviorTimer: 40 + Math.random() * 70,

          stack: 1,        // 合体虫：这只虫子身上叠了几只（画布满 MAX_BUGS 后新虫子合体进来）
          mergeFlash: 0,
          hp: type.hp || 1,
          hurtFlash: 0,
          ghostAlpha: 1,
          trail: []
        };
        if (type.rare) {
          bug.bubble = type.id === 'ghost' ? '嘿' : '嗷';
          bug.state = 'move';
          showToast(RARE_SPAWN_TEXT[type.id]);
        }
        bugs.push(bug);

        // 召唤铅笔烟雾粒子
        for (let i = 0; i < 8; i++) {
          const a = (Math.PI * 2 * i) / 8 + Math.random() * 0.4;
          const spd = 1.5 + Math.random() * 2.5;
          particles.push({
            kind: 'puff',
            x: pos.x,
            y: pos.y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd,
            size: 5 + Math.random() * 6,
            life: 1,
            decay: 0.04 + Math.random() * 0.02,
            color: '#2b2a29'
          });
        }

        return true;
      }

      // 虫子数量没有上限，但画布上最多同时放 MAX_BUGS 只：放不下的就「合体」进已有的虫子，
      // 变成头顶 ×N 的大虫，看起来更唬人，也不会卡
      const MERGE_STACK_CAP = 99;

      function totalBugCount() {
        let n = 0;
        for (const b of bugs) n += b.stack || 1;
        return n;
      }

      function mergeOverflowBugs(n) {
        while (n > 0 && bugs.length > 0) {
          // 优先往已经最大、但还没满 99 的虫子身上叠，让大虫越来越大
          let target = null;
          for (const b of bugs) {
            if (b.type.rare) continue;
            if (b.stack < MERGE_STACK_CAP && (!target || b.stack > target.stack)) target = b;
          }
          if (!target) {
            // 全都满 99 了：随便找一只继续叠（不封顶）
            const pool = bugs.filter((b) => !b.type.rare);
            target = (pool.length ? pool : bugs)[Math.floor(Math.random() * (pool.length ? pool : bugs).length)];
          }
          const room = target.stack < MERGE_STACK_CAP ? MERGE_STACK_CAP - target.stack : n;
          const take = Math.min(n, room);
          target.stack += take;
          target.mergeFlash = 1;
          n -= take;
          for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
              kind: 'puff', x: target.x, y: target.y,
              vx: Math.cos(a) * 2.5, vy: Math.sin(a) * 2.5,
              size: 5 + Math.random() * 5, life: 1, decay: 0.05, color: '#7048e8'
            });
          }
        }
      }

      // 返回 { added, merged }：本次新爬出来几只、有几只合体进了大虫
      function summonBugs(count, opts = {}) {
        let added = 0;
        for (let i = 0; i < count; i++) {
          if (spawnBug()) added++;
          else break;
        }
        const merged = count - added;
        if (merged > 0) mergeOverflowBugs(merged);
        if (added > 0 || merged > 0) {
          playPopSound(added > 3 || merged > 0 ? 2 : 0);
          bumpStat(elStatBugs);
          updateHUD();
        }
        if (!opts.silent && merged > 0) {
          showToast(`🐛 虫子太多啦！${merged} 只虫子合体成了大虫，场上一共 ${totalBugCount()} 只！`);
        }
        return { added, merged };
      }

      function releasePendingBugs() {}

      // 调试用：?debug=1 时可在控制台 debugSpawn('ghost') / debugSpawn('monster') 强制召唤稀有角色
      if (isDebugMode) {
        window.debugSpawn = (id) => { const ok = spawnBug(null, null, id); updateHUD(); return ok; };
        window.debugHit = (id) => { const b = bugs.find((x) => x.type.id === id); if (!b) return null; hitBug(b); return bugs.includes(b) ? b.hp : 'dead'; };
      }

      // ============================
      // 消灭单只虫子
      // ============================
      function eliminateBug(bug, method = 'swatter', silent = false) {
        const idx = bugs.indexOf(bug);
        if (idx === -1) return;
        bugs.splice(idx, 1);

        const now = performance.now();
        if (now - lastKillTime < 900) {
          combo++;
        } else {
          combo = 1;
        }
        lastKillTime = now;

        const bonus = combo >= 3 ? Math.min(combo * 2, 20) : 0;
        const stackN = bug.stack || 1;
        const gained = (bug.type.points + bonus) * stackN;
        killCount += stackN;
        score += gained;

        if (!silent) {
          playSquashSound(combo);
        }

        // 残留涂鸦印记
        if (method !== 'eraser') {
          splats.push({
            x: bug.x,
            y: bug.y,
            rot: Math.random() * Math.PI * 2,
            radius: bug.type.radius * 2 * (0.9 + Math.random() * 0.35),
            color: method === 'spray'
              ? 'rgba(130, 210, 120, 0.35)'
              : method === 'cannon'
                ? 'rgba(255, 146, 43, 0.42)'
                : bug.type.splatColor,
            alpha: 1,
            method
          });
        }

        // 涂鸦爆炸粒子
        const particleCount = method === 'cannon' ? 18 : (method === 'eraser' ? 10 : 12);
        for (let i = 0; i < particleCount; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 2 + Math.random() * (method === 'cannon' ? 6 : 4.5);
          particles.push({
            kind: method === 'eraser' ? 'crumb' : (i % 3 === 0 ? 'star' : 'scribble'),
            x: bug.x,
            y: bug.y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - (method === 'spray' ? 1.2 : 0.4),
            size: 4 + Math.random() * 6,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 0.25,
            life: 1,
            decay: 0.025 + Math.random() * 0.02,
            color: method === 'eraser'
              ? '#e9d8a6'
              : method === 'cannon'
                ? (i % 2 === 0 ? '#ff6b6b' : '#fcc419')
                : bug.type.color
          });
        }

        // 飘字
        const words = method === 'spray'
          ? ['晕了~', '噗!', 'KO!']
          : method === 'eraser'
            ? ['擦掉!', '干净!', '唰~']
            : method === 'cannon'
              ? ['💣轰沉!', '🔥炮击KO!', '💥命中!']
              : ['啪!', '拍扁!', 'KO!'];
        const label = stackN > 1
          ? `💥 合体虫 ×${stackN} 消灭! +${gained}`
          : bug.type.id === 'golden'
          ? `✨+${gained}!`
          : bug.type.id === 'ghost'
          ? `👻 小鬼被赶跑啦! +${gained}`
          : bug.type.id === 'monster'
          ? `👾 打倒小怪兽! +${gained}`
          : `${words[Math.floor(Math.random() * words.length)]} +${gained}`;

        floatTexts.push({
          x: bug.x,
          y: bug.y - 10,
          vy: -1.6,
          text: label,
          color: bug.type.id === 'golden'
            ? '#e67700'
            : bug.type.rare
            ? '#7048e8'
            : method === 'cannon'
              ? '#d9480f'
              : '#d63c3c',
          scale: (bug.type.id === 'golden' || bug.type.rare) ? 1.25 : (method === 'cannon' ? 1.15 : 1),
          life: 1
        });

        updateHUD();
        bumpStat(elStatKilled);
        bumpStat(elStatScore);
      }

      // 单体攻击（苍蝇拍单拍 / 舰炮直击）：合体虫只打掉一层，大虫要多打几下
      function hitBug(bug, method = 'swatter', silent = false) {
        if (!bugs.includes(bug)) return;
        if ((bug.hp || 1) > 1) {
          bug.hp--;
          bug.hurtFlash = 1;
          if (!silent) playSquashSound(1);
          for (let i = 0; i < 6; i++) {
            const a = Math.random() * Math.PI * 2;
            particles.push({
              kind: 'star', x: bug.x, y: bug.y,
              vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
              size: 5 + Math.random() * 4, rot: Math.random() * Math.PI * 2, vrot: 0.1,
              life: 1, decay: 0.04, color: bug.type.color
            });
          }
          const ouch = bug.type.id === 'ghost' ? ['哎哟!', '别拍我!', '呜~'] : ['嗷呜!', '好痛!', '可恶!'];
          floatTexts.push({ x: bug.x, y: bug.y - 26, vy: -1.4, text: `${ouch[Math.floor(Math.random() * ouch.length)]} 还剩${bug.hp}下`, color: '#7048e8', scale: 1, life: 0.9 });
          return;
        }
        if ((bug.stack || 1) <= 1) {
          eliminateBug(bug, method, silent);
          return;
        }
        bug.stack--;
        bug.mergeFlash = 0.6;
        killCount++;
        score += bug.type.points;
        if (!silent) playSquashSound(1);
        for (let i = 0; i < 6; i++) {
          const a = Math.random() * Math.PI * 2;
          particles.push({
            kind: 'scribble', x: bug.x, y: bug.y,
            vx: Math.cos(a) * 3, vy: Math.sin(a) * 3,
            size: 4 + Math.random() * 4, rot: Math.random() * Math.PI * 2, vrot: 0.1,
            life: 1, decay: 0.04, color: bug.type.color
          });
        }
        floatTexts.push({ x: bug.x, y: bug.y - 20, vy: -1.4, text: `-1 (还剩×${bug.stack})`, color: '#7048e8', scale: 0.9, life: 0.8 });
        updateHUD();
        bumpStat(elStatKilled);
      }

      // ============================
      // 一键杀虫大招 (三种手绘特效)
      // ============================
      function triggerMassKill() {
        if (bugs.length === 0) {
          showToast('画纸很干净呀，先点「召唤虫子」吧！🐛');
          return;
        }

        if (currentWeapon === 'swatter') {
          // 苍蝇拍：依次快速连拍场上所有虫子
          const targets = [...bugs];
          screenShake = 10;
          showToast(`🩴 苍蝇拍连击！消灭 ${targets.length} 只虫子！`);
          targets.forEach((bug, i) => {
            const delay = Math.min(i * 45, 550);
            setTimeout(() => {
              if (!bugs.includes(bug)) return;
              activeEffects.push({
                kind: 'swatter',
                x: bug.x,
                y: bug.y,
                life: 1,
                angle: -0.35 + (Math.random() - 0.5) * 0.4
              });
              screenShake = Math.max(screenShake, 5);
              eliminateBug(bug, 'swatter', i > 6 && i % 2 === 0);
            }, delay);
          });
        } else if (currentWeapon === 'spray') {
          // 毒气喷雾：喷出绿色涂鸦毒气云，虫子眩晕后全部变成小星星消失
          playSpraySound();
          const targets = [...bugs];
          showToast(`🧴 滋滋滋——涂鸦喷雾消灭 ${targets.length} 只虫子！`);
          for (let i = 0; i < 24; i++) {
            activeEffects.push({
              kind: 'gas',
              x: width * 0.15 + Math.random() * width * 0.7,
              y: height * 0.18 + Math.random() * height * 0.62,
              r: 28 + Math.random() * 55,
              life: 1,
              vx: (Math.random() - 0.5) * 1.4,
              vy: -0.5 - Math.random() * 0.9
            });
          }
          targets.forEach((b) => { b.dizzy = 1; });
          setTimeout(() => {
            targets.forEach((bug, i) => {
              if (bugs.includes(bug)) {
                eliminateBug(bug, 'spray', i > 4);
              }
            });
          }, 360);
        } else if (currentWeapon === 'eraser') {
          // 大橡皮擦：一块巨型手绘橡皮从左到右横扫清屏，连涂鸦污渍也一并擦干净！
          playEraserSound();
          const total = bugs.length;
          showToast(`🧽 大橡皮出动！擦掉 ${total} 只虫子和涂鸦痕迹！`);
          activeEffects.push({
            kind: 'eraserSweep',
            x: -120,
            y: height * 0.5,
            speed: Math.max(22, width / 24),
            life: 1
          });
        }
      }

      // ============================
      // 手绘绘制辅助函数
      // ============================
      function jitter(amount = 1.2) {
        // 每 6 帧轻微抖动一次，营造手绘动画感 (boiling lines)
        const step = Math.floor(frameCount / 6);
        const s = Math.sin(step * 12.9898 + amount * 78.233) * 43758.5453;
        return ((s - Math.floor(s)) - 0.5) * amount;
      }

      function drawPaperDoodles() {
        ctx.save();
        ctx.strokeStyle = 'rgba(91, 87, 80, 0.22)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        for (const d of paperDoodles) {
          const x = d.rx * width;
          const y = d.ry * height;
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(d.rot);

          if (d.type === 'star') {
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
              const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
              const px = Math.cos(a) * d.s;
              const py = Math.sin(a) * d.s;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.stroke();
          } else if (d.type === 'spiral') {
            ctx.beginPath();
            for (let t = 0; t < 18; t += 0.35) {
              const r = t * 1.1;
              const px = Math.cos(t) * r;
              const py = Math.sin(t) * r;
              if (t === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.stroke();
          } else if (d.type === 'cloud') {
            ctx.beginPath();
            ctx.arc(-14, 4, 12, Math.PI * 0.5, Math.PI * 1.6);
            ctx.arc(0, -4, 15, Math.PI, Math.PI * 2);
            ctx.arc(16, 4, 12, Math.PI * 1.4, Math.PI * 0.5);
            ctx.closePath();
            ctx.stroke();
          } else if (d.type === 'flower') {
            for (let i = 0; i < 5; i++) {
              const a = (i * Math.PI * 2) / 5;
              ctx.beginPath();
              ctx.arc(Math.cos(a) * 10, Math.sin(a) * 10, 6, 0, Math.PI * 2);
              ctx.stroke();
            }
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.stroke();
          }
          ctx.restore();
        }
        ctx.restore();
      }

      function drawSplat(s) {
        ctx.save();
        ctx.globalAlpha = s.alpha;
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);

        // 涂鸦色块
        ctx.fillStyle = s.color;
        ctx.beginPath();
        const lobes = 7;
        for (let i = 0; i <= lobes * 2; i++) {
          const a = (i * Math.PI) / lobes;
          const r = i % 2 === 0 ? s.radius * 1.1 : s.radius * 0.65;
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();

        // 晕倒的 X_X 涂鸦小表情
        ctx.strokeStyle = 'rgba(43, 42, 41, 0.55)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        // 左 X
        ctx.beginPath();
        ctx.moveTo(-7, -4); ctx.lineTo(-3, 0);
        ctx.moveTo(-3, -4); ctx.lineTo(-7, 0);
        // 右 X
        ctx.moveTo(3, -4); ctx.lineTo(7, 0);
        ctx.moveTo(7, -4); ctx.lineTo(3, 0);
        ctx.stroke();

        ctx.restore();
      }

      function stackSizeMult(bug) {
        const n = bug.stack || 1;
        return n <= 1 ? 1 : 1 + Math.min(0.9, Math.log10(n) * 0.5);
      }

      // 合体虫头顶的 ×N 标签
      function drawStackLabel(bug) {
        if ((bug.stack || 1) <= 1) return;
        const text = `×${bug.stack}`;
        const y = bug.y - 30 * stackSizeMult(bug) - 10;
        const pulse = 1 + (bug.mergeFlash || 0) * 0.35;
        ctx.save();
        ctx.translate(bug.x, y);
        ctx.scale(pulse, pulse);
        ctx.font = 'bold 18px "Comic Sans MS", "Chalkboard SE", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const w = ctx.measureText(text).width + 14;
        ctx.fillStyle = '#7048e8';
        ctx.strokeStyle = '#2b2a29';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-w / 2, -12, w, 24, 10); else ctx.rect(-w / 2, -12, w, 24);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.fillText(text, 0, 1);
        ctx.restore();
        if (bug.mergeFlash > 0) bug.mergeFlash = Math.max(0, bug.mergeFlash - 0.04);
      }

      function drawBug(bug) {
        const j = jitter(1.1);
        const legSwing = Math.sin(bug.wigglePhase) * 4;

        ctx.save();
        ctx.translate(bug.x, bug.y);

        // 飞行/爬行特色轨迹（蜜蜂/蚊子虚线、蜗牛黏液线、蝴蝶花粉点）
        if (bug.trail.length > 2) {
          ctx.save();
          ctx.translate(-bug.x, -bug.y);
          if (bug.type.id === 'snail') {
            ctx.strokeStyle = 'rgba(180, 215, 235, 0.45)';
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.beginPath();
            bug.trail.forEach((pt, idx) => {
              if (idx === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
          } else if (bug.type.id === 'butterfly') {
            bug.trail.forEach((pt, idx) => {
              ctx.globalAlpha = ((idx + 1) / bug.trail.length) * 0.55;
              ctx.fillStyle = bug.wingColor;
              ctx.beginPath();
              ctx.arc(pt.x, pt.y, 2.5, 0, Math.PI * 2);
              ctx.fill();
            });
          } else {
            ctx.strokeStyle = 'rgba(43, 42, 41, 0.24)';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([4, 5]);
            ctx.beginPath();
            bug.trail.forEach((pt, idx) => {
              if (idx === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
          }
          ctx.restore();
        }

        // 顶部小情绪气泡
        if (bug.bubble && bug.scale > 0.8) {
          ctx.save();
          ctx.translate(24, -46 + Math.sin(frameCount * 0.1) * 2);
          ctx.fillStyle = '#fff';
          ctx.strokeStyle = '#2b2a29';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = '#2b2a29';
          ctx.font = 'bold 13px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(bug.dizzy > 0 ? '@' : bug.bubble, 0, 1);
          ctx.restore();
        }

        const hopBoost = 1 + (bug.hopAir || 0) * 0.42;
        const BUG_SIZE_MULT = 2 * stackSizeMult(bug);
        ctx.scale(bug.scale * hopBoost * BUG_SIZE_MULT, bug.scale * hopBoost * BUG_SIZE_MULT);
        ctx.rotate(bug.angle + (bug.dizzy > 0 ? Math.sin(frameCount * 0.5) * 0.4 : 0));

        ctx.strokeStyle = '#2b2a29';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        const id = bug.type.id;

        if (id === 'ladybug' || id === 'golden') {
          // 六条手绘小腿
          for (let side of [-1, 1]) {
            for (let i = -1; i <= 1; i++) {
              const offset = (i === 0 ? -legSwing : legSwing) * side * 0.6;
              ctx.beginPath();
              ctx.moveTo(i * 6, side * 11);
              ctx.lineTo(i * 8 + offset, side * 19);
              ctx.stroke();
            }
          }

          // 触角
          ctx.beginPath();
          ctx.moveTo(13, -4); ctx.quadraticCurveTo(21, -10, 23, -7);
          ctx.moveTo(13, 4); ctx.quadraticCurveTo(21, 10, 23, 7);
          ctx.stroke();

          // 身体外壳
          ctx.fillStyle = bug.type.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, 16 + j * 0.5, 13 - j * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 头部
          ctx.fillStyle = '#2b2a29';
          ctx.beginPath();
          ctx.arc(13, 0, 6.5, -Math.PI * 0.55, Math.PI * 0.55);
          ctx.fill();

          // 中缝线
          ctx.beginPath();
          ctx.moveTo(-15, 0);
          ctx.lineTo(9, 0);
          ctx.stroke();

          // 斑点或黄金星光
          if (id === 'ladybug') {
            ctx.fillStyle = '#2b2a29';
            [[-6, -6], [2, -7], [-6, 6], [2, 7]].forEach(([px, py]) => {
              ctx.beginPath();
              ctx.arc(px, py, 2.4, 0, Math.PI * 2);
              ctx.fill();
            });
          } else {
            // 黄金甲虫闪光
            ctx.strokeStyle = '#fff9db';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, -5); ctx.lineTo(1, -5);
            ctx.moveTo(-2, -8); ctx.lineTo(-2, -2);
            ctx.stroke();
          }

          // 可爱大眼睛
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(15, -3, 2.5, 0, Math.PI * 2);
          ctx.arc(15, 3, 2.5, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#2b2a29';
          ctx.beginPath();
          ctx.arc(16, -3, 1.1, 0, Math.PI * 2);
          ctx.arc(16, 3, 1.1, 0, Math.PI * 2);
          ctx.fill();

        } else if (id === 'caterpillar') {
          // 蠕动节段
          const segs = 4;
          for (let i = segs - 1; i >= 0; i--) {
            const sx = -i * 9 + 10;
            const sy = Math.sin(bug.wigglePhase + i * 1.1) * 3.2;
            const r = i === 0 ? 9.5 : 8 - i * 0.6;

            // 小短腿
            ctx.beginPath();
            ctx.moveTo(sx, sy + r - 2);
            ctx.lineTo(sx - 2, sy + r + 5);

            ctx.roundRect(-5, 22, 10, 62, 5);
            ctx.fill();
            ctx.stroke();

            // 拍面
            ctx.fillStyle = 'rgba(255, 107, 107, 0.85)';
            ctx.beginPath();
            ctx.roundRect(-28, -28, 56, 52, 12);
            ctx.fill();
            ctx.stroke();

            // 网格线
            ctx.lineWidth = 1.6;
            for (let gx = -18; gx <= 18; gx += 9) {
              ctx.beginPath();
              ctx.moveTo(gx, -24); ctx.lineTo(gx, 20);
              ctx.stroke();
            }
            for (let gy = -18; gy <= 14; gy += 8) {
              ctx.beginPath();
              ctx.moveTo(-24, gy); ctx.lineTo(24, gy);
              ctx.stroke();
            }

            // 冲击放射线
            if (ef.life > 0.55) {
              ctx.strokeStyle = '#2b2a29';
              ctx.lineWidth = 2.2;
              for (let a = 0; a < 8; a++) {
                const rad = (a * Math.PI) / 4;
                ctx.beginPath();
                ctx.moveTo(Math.cos(rad) * 34, Math.sin(rad) * 34);
                ctx.lineTo(Math.cos(rad) * 46, Math.sin(rad) * 46);
                ctx.stroke();
              }
            }
            ctx.restore();

            ef.life -= 0.065;
            if (ef.life <= 0) activeEffects.splice(i, 1);

          } else if (ef.kind === 'gas') {
            ctx.save();
            ctx.globalAlpha = ef.life * 0.55;
            ctx.fillStyle = '#b2f2bb';
            ctx.strokeStyle = '#2b8a3e';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, ef.r * (1.2 - ef.life * 0.3), 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ef.x += ef.vx;
            ef.y += ef.vy;
            ef.life -= 0.018;
            if (ef.life <= 0) activeEffects.splice(i, 1);

          } else if (ef.kind === 'eraserSweep') {
            ef.x += ef.speed;
            const swayY = Math.sin(ef.x * 0.04) * (height * 0.22);

            // 擦除经过的虫子
            for (let b = bugs.length - 1; b >= 0; b--) {
              if (bugs[b].x <= ef.x + 65) {
                eliminateBug(bugs[b], 'eraser', true);
              }
            }
            // 同时擦除污渍
            for (let s = splats.length - 1; s >= 0; s--) {
              if (splats[s].x <= ef.x + 65) {
                splats.splice(s, 1);
              }
            }

            // 生成橡皮屑
            if (frameCount % 2 === 0) {
              particles.push({
                kind: 'crumb',
                x: ef.x - 20 + Math.random() * 40,
                y: height * 0.2 + Math.random() * height * 0.6,
                vx: -2 - Math.random() * 3,
                vy: (Math.random() - 0.5) * 3,
                size: 4 + Math.random() * 5,
                rot: Math.random() * Math.PI,
                vrot: 0.15,
                life: 1,
                decay: 0.025,
                color: '#f1f3f5'
              });
            }

            // 绘制巨型手绘红蓝橡皮擦
            ctx.save();
            ctx.translate(ef.x, height * 0.5 + swayY);
            ctx.rotate(-0.18);
            ctx.strokeStyle = '#2b2a29';
            ctx.lineWidth = 4;

            // 白色/粉色主体
            ctx.fillStyle = '#ffccd5';
            ctx.beginPath();
            ctx.roundRect(-55, -130, 110, 260, 16);
            ctx.fill();
            ctx.stroke();

            // 蓝色纸套
            ctx.fillStyle = '#74c0fc';
            ctx.beginPath();
            ctx.roundRect(-55, -20, 110, 150, [0, 0, 16, 16]);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#2b2a29';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('橡皮擦', 0, 62);
            ctx.restore();

            if (ef.x > width + 140) {
              activeEffects.splice(i, 1);
            }
          } else if (ef.kind === 'waveSplash') {
            // 大航海战舰破浪登场水花圈
            ctx.save();
            ctx.globalAlpha = ef.life;
            ctx.translate(ef.x, ef.y);

            const r = ef.maxR * (1 - ef.life * 0.72);
            // 手绘湛蓝海浪椭圆形波纹
            ctx.strokeStyle = '#339af0';
            ctx.lineWidth = 3.5 * ef.life + 1;
            ctx.beginPath();
            ctx.ellipse(0, 10, r, r * 0.42, 0, 0, Math.PI * 2);
            ctx.stroke();

            // 内圈白色浪花虚线
            ctx.strokeStyle = '#74c0fc';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([8, 6]);
            ctx.beginPath();
            ctx.ellipse(0, 10, r * 0.7, r * 0.3, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // 飞溅浪花水线
            for (let k = 0; k < 8; k++) {
              const a = -Math.PI * 0.1 - (k * Math.PI * 0.8) / 7;
              const dist = r * 0.65;
              ctx.strokeStyle = k % 2 === 0 ? '#339af0' : '#2b2a29';
              ctx.lineWidth = 2.2;
              ctx.beginPath();
              ctx.moveTo(Math.cos(a) * dist, 10 + Math.sin(a) * dist * 0.6);
              ctx.lineTo(Math.cos(a) * (dist + 16), 10 + Math.sin(a) * (dist + 16) * 0.6);
              ctx.stroke();
            }
            ctx.restore();

            ef.life -= 0.038;
            if (ef.life <= 0) activeEffects.splice(i, 1);
          } else if (ef.kind === 'cannonBlast') {
            // 加农炮命中手绘火焰冲击波
            ctx.save();
            ctx.globalAlpha = ef.life;
            ctx.translate(ef.x, ef.y);
            const r = ef.maxR * (1 - ef.life * 0.65);

            ctx.fillStyle = 'rgba(255, 169, 77, 0.45)';
            ctx.strokeStyle = '#d9480f';
            ctx.lineWidth = 3 * ef.life;
            ctx.beginPath();
            const spikes = 10;
            for (let k = 0; k < spikes * 2; k++) {
              const a = (k * Math.PI) / spikes;
              const rad = k % 2 === 0 ? r : r * 0.58;
              const px = Math.cos(a) * rad;
              const py = Math.sin(a) * rad;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();

            ef.life -= 0.06;
            if (ef.life <= 0) activeEffects.splice(i, 1);
          } else if (ef.kind === 'maelstrom') {
            // 🌊 大招·怒海漩涡：持续吸入并卷灭范围内所有虫子
            ef.rot += 0.14;
            const curR = ef.radius * Math.sin(Math.min(1, ef.life * 1.4) * (Math.PI / 2));

            // 吸引并卷灭范围内虫子
            for (let b = bugs.length - 1; b >= 0; b--) {
              const bug = bugs[b];
              const dx = ef.x - bug.x;
              const dy = ef.y - bug.y;
              const d = Math.hypot(dx, dy);
              if (d < ef.radius) {
                const pull = 0.14;
                const swirlA = Math.atan2(dy, dx) + 0.65;
                bug.x += Math.cos(swirlA) * 7.5 + dx * pull;
                bug.y += Math.sin(swirlA) * 7.5 + dy * pull;
                bug.dizzy = 1;
                if (d < 42 || ef.life < 0.28) {
                  eliminateBug(bug, 'cannon', true);
                }
              }
            }

            ctx.save();
            ctx.globalAlpha = Math.min(1, ef.life * 1.5);
            ctx.translate(ef.x, ef.y);

            // 外圈蓝色漩涡底影
            ctx.fillStyle = 'rgba(28, 126, 214, 0.22)';
            ctx.beginPath();
            ctx.arc(0, 0, curR, 0, Math.PI * 2);
            ctx.fill();

            // 手绘多股旋转海浪螺旋线
            ctx.rotate(ef.rot);
            for (let arm = 0; arm < 4; arm++) {
              ctx.rotate(Math.PI / 2);
              ctx.strokeStyle = arm % 2 === 0 ? '#1c7ed6' : '#74c0fc';
              ctx.lineWidth = arm % 2 === 0 ? 4 : 2.6;
              ctx.lineCap = 'round';
              ctx.beginPath();
              for (let t = 0.2; t < 4.2; t += 0.18) {
                const rr = (t / 4.2) * curR;
                const px = Math.cos(t * 1.35) * rr;
                const py = Math.sin(t * 1.35) * rr;
                if (t === 0.2) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
              }
              ctx.stroke();
            }

            // 漩涡黑墨水手绘旋风眼
            ctx.strokeStyle = '#2b2a29';
            ctx.lineWidth = 2.4;
            ctx.setLineDash([10, 8]);
            ctx.beginPath();
            ctx.arc(0, 0, curR * 0.85, 0, Math.PI * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            ef.life -= 0.015;
            if (ef.life <= 0) activeEffects.splice(i, 1);

          } else if (ef.kind === 'tempest') {
            // ⚡ 大招·海神风暴雷霆：乌云压顶 + 锯齿闪电范围劈灭虫群
            ctx.save();
            ctx.globalAlpha = Math.min(1, ef.life * 1.6);

            // 范围雷击光圈
            ctx.fillStyle = 'rgba(255, 224, 102, 0.18)';
            ctx.strokeStyle = '#fcc419';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 6]);
            ctx.beginPath();
            ctx.arc(ef.x, ef.y, ef.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);

            // 顶部手绘雷暴乌云
            const cy = ef.y - ef.radius * 0.65;
            ctx.fillStyle = '#495057';
            ctx.strokeStyle = '#2b2a29';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(ef.x - 42, cy + 6, 26, 0, Math.PI * 2);
            ctx.arc(ef.x, cy - 8, 34, 0, Math.PI * 2);
            ctx.arc(ef.x + 42, cy + 6, 26, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 多道锯齿手绘金色闪电
            ef.bolts.forEach((bolt) => {
              ctx.strokeStyle = '#ffd43b';
              ctx.shadowColor = '#fcc419';
              ctx.shadowBlur = 14;
              ctx.lineWidth = 5 * ef.life;
              ctx.beginPath();
              bolt.forEach((pt, idx) => {
                if (idx === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
              });
              ctx.stroke();

              ctx.shadowBlur = 0;
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 2 * ef.life;
              ctx.stroke();
            });
            ctx.restore();

            ef.life -= 0.032;
            if (ef.life <= 0) activeEffects.splice(i, 1);

          } else if (ef.kind === 'kraken') {
            // 🐙 大招·深海克拉肯触手：6 条巨大手绘章鱼触手范围横扫拍扁虫子
            const swing = Math.sin((1 - ef.life) * Math.PI);
            const reach = ef.radius * swing;

            if (!ef.struck && ef.life < 0.62) {
              ef.struck = true;
              screenShake = Math.max(screenShake, 11);
              for (let b = bugs.length - 1; b >= 0; b--) {
                const bug = bugs[b];
                if (Math.hypot(bug.x - ef.x, bug.y - ef.y) <= ef.radius) {
                  eliminateBug(bug, 'cannon', true);
                }
              }
            }

            ctx.save();
            ctx.globalAlpha = Math.min(1, ef.life * 1.5);
            ctx.translate(ef.x, ef.y);

            // 深海召唤水面圆环
            ctx.fillStyle = 'rgba(132, 94, 247, 0.22)';
            ctx.strokeStyle = '#7048e8';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, ef.radius * 0.9, ef.radius * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 6 条弯曲甩动的手绘紫红触手
            for (let t = 0; t < 6; t++) {
              const baseA = (t * Math.PI * 2) / 6 + ef.rot;
              const curl = Math.sin(frameCount * 0.25 + t) * 24;
              const endX = Math.cos(baseA) * reach;
              const endY = Math.sin(baseA) * reach;
              const ctrlX = Math.cos(baseA + 0.35) * (reach * 0.55) + curl * 0.3;
              const ctrlY = Math.sin(baseA + 0.35) * (reach * 0.55) - 24;

              ctx.strokeStyle = '#2b2a29';
              ctx.lineWidth = 14;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(ctrlX, ctrlY, endX, endY);
              ctx.stroke();

              ctx.strokeStyle = t % 2 === 0 ? '#ae3ec9' : '#d6336c';
              ctx.lineWidth = 9;
              ctx.stroke();

              // 触手吸盘圆点
              ctx.fillStyle = '#fcc2d7';
              for (const frac of [0.35, 0.6, 0.82]) {
                const sx = (1 - frac) * (1 - frac) * 0 + 2 * (1 - frac) * frac * ctrlX + frac * frac * endX;
                const sy = (1 - frac) * (1 - frac) * 0 + 2 * (1 - frac) * frac * ctrlY + frac * frac * endY;
                ctx.beginPath();
                ctx.arc(sx, sy, 3.2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
            ctx.restore();

            ef.life -= 0.022;
            if (ef.life <= 0) activeEffects.splice(i, 1);
          } else if (ef.kind === 'admiralFx') {
            // 👑 提督机甲专属：炮口闪光 / 命中爆发 / 登场光柱或天雷
            if (drawAdmiralEffect(ef)) activeEffects.splice(i, 1);
          }
        }
