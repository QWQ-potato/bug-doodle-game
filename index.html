          ctx.beginPath();
          ctx.arc(0, 0, avatarR + 6.5 * sc, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge);
          ctx.stroke();
          ctx.restore();
        }

        // 战舰上只显示观众头像，不显示昵称和剩余倒计时

        ctx.restore();
      }

      function updateShipsAndCannons() {
        // 守护船共享的自动开火额度（每帧按 60fps 回充），多艘新舰长同时在场也不会把虫子秒光
        autoFireBudget = Math.min(3, autoFireBudget + AUTO_FIRE_PER_SEC / 60);
        const marginLeft = 64;
        const marginRight = width - 64;
        const marginTop = hideHud ? 95 : 115;
        const marginBottom = isObsMode ? height - 55 : height - 175;
        const now = performance.now();

        for (let sIdx = ships.length - 1; sIdx >= 0; sIdx--) {
          const ship = ships[sIdx];

          // 超过 1 分钟（60秒）未再刷灯牌，战舰水花退场消失
          if (ship.expiresAt && now >= ship.expiresAt) {
            activeEffects.push({
              kind: 'waveSplash',
              x: ship.x,
              y: ship.y,
              maxR: 78,
              life: 1
            });
            ships.splice(sIdx, 1);
            continue;
          }

          // 沉船动画：侧翻下沉、冒泡，播完从场上拿掉
          if (ship.sinking) {
            ship.sinking++;
            const t = ship.sinking / SHIP_SINK_FRAMES;
            if (frameCount % 4 === 0) emitShipSmoke(ship);
            if (frameCount % 6 === 0) {
              activeEffects.push({ kind: 'waveSplash', x: ship.x + (Math.random() - 0.5) * 40, y: ship.y + 10, maxR: 30 + Math.random() * 30, life: 1 });
            }
            if (t >= 1) {
              activeEffects.push({ kind: 'waveSplash', x: ship.x, y: ship.y, maxR: 90, life: 1 });
              ships.splice(sIdx, 1);
              finishSinking(ship, now);
              continue;
            }
            ctx.save();
            ctx.globalAlpha = 1 - t;
            ctx.translate(ship.x, ship.y + t * 40);
            ctx.rotate(t * 0.9 * (ship.facing || 1));
            ctx.translate(-ship.x, -ship.y);
            drawShip(ship);
            ctx.restore();
            continue;
          }

          if (ship.hitFlash > 0) ship.hitFlash = Math.max(0, ship.hitFlash - 0.08);
          if (ship.hp <= ship.maxHp * SHIP_LOW_HP_RATIO && frameCount % 5 === 0) emitShipSmoke(ship);

          if (ship.spawnScale < 1) {
            ship.spawnScale = Math.min(1, ship.spawnScale + 0.08);
          }
          if (ship.recoil > 0) {
            ship.recoil = Math.max(0, ship.recoil - 0.12);
          }

          // 提督尊贵机甲战舰变形逻辑（登场展示、攻击或释放大招时展开机甲，平时和平巡航折叠回战舰）
          if (ship.cls.isAdmiral) {
            if (ship.morphShowcaseTimer > 0) ship.morphShowcaseTimer--;
            const wantMech = (ship.pendingAttacks > 0 || ship.morphShowcaseTimer > 0) ? 1 : 0;
            if (wantMech !== ship.morphTarget) {
              ship.morphTarget = wantMech;
              if (wantMech === 1 && ship.spawnScale >= 0.9) {
                playTransformSound();
              }
            }
            ship.morph += (ship.morphTarget - ship.morph) * 0.085;
          }

          // 寻找最近的目标虫子
          let nearest = null;
          let nearestDist = Infinity;
          for (const b of bugs) {
            const d = Math.hypot(b.x - ship.x, b.y - ship.y);
            if (d < nearestDist) {
              nearestDist = d;
              nearest = b;
            }
          }
          ship.targetBug = nearest;

          if (nearest) {
            const desiredAngle = Math.atan2(nearest.y - ship.y, nearest.x - ship.x);
            // 保持优雅的舷侧炮击巡航距离
            if (nearestDist > 165) {
              ship.targetAngle = desiredAngle;
            } else {
              ship.targetAngle = desiredAngle + Math.PI * 0.48;
            }
          } else {
            // 无虫子时乘风破浪巡航
            ship.patrolTimer--;
            if (ship.patrolTimer <= 0) {
              ship.targetAngle += (Math.random() - 0.5) * 1.7;
              ship.patrolTimer = 55 + Math.random() * 80;
            }
          }

          // 平滑转向
          let diff = ship.targetAngle - ship.angle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          ship.angle += diff * 0.055;

          const vx = Math.cos(ship.angle) * ship.cls.speed;
          const vy = Math.sin(ship.angle) * ship.cls.speed;
          ship.x += vx;
          ship.y += vy;

          // 根据水平航向决定船头朝左还是朝右
          if (Math.abs(vx) > 0.25) {
            ship.facing = vx >= 0 ? 1 : -1;
          }

          // 边界平滑返航（提督机甲翼展更宽、头像更高，留出更大的边距防止出画）
          const admPadX = ship.cls.isAdmiral ? 56 : 0;
          const admPadTop = ship.cls.isAdmiral ? 135 : 0;
          if (ship.x < marginLeft + admPadX) {
            ship.x = marginLeft + admPadX;
            ship.targetAngle = 0;
          } else if (ship.x > marginRight - admPadX) {
            ship.x = marginRight - admPadX;
            ship.targetAngle = Math.PI;
          }
          if (ship.y < marginTop + admPadTop) {
            ship.y = marginTop + admPadTop;
            ship.targetAngle = Math.PI / 2;
          } else if (ship.y > marginBottom) {
            ship.y = marginBottom;
            ship.targetAngle = -Math.PI / 2;
          }

          // 记录海面浪花尾迹
          if (frameCount % 3 === 0) {
            ship.wake.push({
              x: ship.x - ship.facing * (ship.cls.isAdmiral ? 84 : 32),
              y: ship.y + (ship.cls.isAdmiral ? 22 : 18)
            });
            if (ship.wake.length > 18) ship.wake.shift();
          }

          // 自动开炮（全场额度限制）：新舰长守护船火力随时间减弱；提督船只在灯牌换来的时间内满火力
          const autoOn = ship.mode === 'guard' || (ship.mode === 'admiral' && ship.autoFireUntil > now);
          if (autoOn && ship.spawnScale >= 1) {
            if (ship.autoFireTimer > 0) ship.autoFireTimer--;
            if (nearest && ship.autoFireTimer <= 0 && ship.pendingAttacks === 0 && autoFireBudget >= 1) {
              autoFireBudget -= 1;
              ship.pendingAttacks = 1;
              ship.autoFireTimer = ship.mode === 'admiral' ? GUARD_FIRE_FAST : guardFireInterval(ship, now);
            }
          }

          // 灯牌船只在主人送礼物时开炮；守护船额外自动开炮
          if (ship.fireCooldown > 0) ship.fireCooldown--;
          if (ship.spawnScale >= 1 && ship.pendingUlt) {
            ship.pendingUlt = false;
            if (bugs.length > 0) triggerShipUltimate(ship);
          }

          // 互殴炮弹：打最近的别人的船
          if (ship.spawnScale >= 1 && ship.pvpShots.length > 0 && ship.fireCooldown <= 0) {
            const enemy = pickEnemyShip(ship);
            if (!enemy) {
              ship.pvpShots = [];
            } else {
              const dmg = ship.pvpShots.shift();
              ship.fireCooldown = 14;
              ship.recoil = 1;
              const isAdmP = !!ship.cls.isAdmiral;
              const sx = ship.x + ship.facing * 6;
              const sy = ship.y + 8 - (isAdmP ? 20 * ship.morph : 0);
              cannonballs.push({
                x: sx, y: sy, startX: sx, startY: sy,
                targetX: enemy.x, targetY: enemy.y,
                targetBug: null, targetShip: enemy, damage: dmg,
                attackerName: ship.ownerName || '神秘船长',
                progress: 0, speed: isAdmP ? 0.07 : 0.055,
                adm: isAdmP ? (ship.cls.id === 'admiral_titan' ? 'titan' : 'dragon') : null,
                isUlt: dmg >= 30, trail: []
              });
              for (let k = 0; k < 6; k++) {
                const a = Math.atan2(enemy.y - sy, enemy.x - sx) + (Math.random() - 0.5) * 0.9;
                const spd = 1.5 + Math.random() * 3;
                particles.push({
                  kind: 'puff', x: sx, y: sy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
                  size: 6 + Math.random() * 6, life: 0.9, decay: 0.045,
                  color: k < 3 ? '#ff922b' : '#495057'
                });
              }
              playCannonSound();
              screenShake = Math.max(screenShake, 4);
            }
          }

          if (ship.spawnScale >= 1 && ship.pendingAttacks > 0 && ship.fireCooldown <= 0) {
            ship.pendingAttacks--;
            ship.fireCooldown = 14;
            ship.recoil = 1;

            const startX = ship.x + ship.facing * 6;
            const startY = ship.y + 8;
            const targetX = nearest ? nearest.x : Math.max(40, Math.min(width - 40, ship.x + ship.facing * 160));
            const targetY = nearest ? nearest.y : Math.max(95, Math.min(height - 155, ship.y + (Math.random() - 0.5) * 70));

            // 提督机甲战舰在机甲形态下发射双联高速尊贵炮弹！
            // 圣金天穹：双臂圣炮射出金色光枪；紫霄雷龙：双肩雷球炮射出紫电雷光弹
            const isAdm = !!ship.cls.isAdmiral;
            const admKind = isAdm ? (ship.cls.id === 'admiral_titan' ? 'titan' : 'dragon') : null;
            const mechVolley = isAdm && ship.morph > 0.5;
            const shotCount = mechVolley ? 2 : 1;
            for (let s = 0; s < shotCount; s++) {
              let sx = startX;
              let sy = startY - (isAdm ? 20 * ship.morph : 0);
              if (mechVolley) {
                const side = s === 0 ? -1 : 1;
                sx = ship.x + side * (admKind === 'titan' ? 63 : 36);
                sy = ship.y + (admKind === 'titan' ? -49 : -97);
                activeEffects.push({ kind: 'admiralFx', fx: 'muzzle', variant: admKind, x: sx, y: sy, life: 1 });
              }
              cannonballs.push({
                x: sx,
                y: sy,
                startX: sx,
                startY: sy,
                targetX,
                targetY,
                targetBug: nearest,
                progress: 0,
                speed: isAdm ? 0.095 : 0.075,
                adm: admKind,
                trail: []
              });
            }

            // 炮口黑烟与火光粒子（提督机甲换成金色圣光 / 紫电火花）
            for (let k = 0; k < 7; k++) {
              const a = Math.atan2(targetY - startY, targetX - startX) + (Math.random() - 0.5) * 0.9;
              const spd = 1.5 + Math.random() * 3;
              particles.push({
                kind: 'puff',
                x: startX,
                y: startY,
                vx: Math.cos(a) * spd,
                vy: Math.sin(a) * spd,
                size: 6 + Math.random() * 6,
                life: 0.9,
                decay: 0.045,
                color: admKind === 'titan'
                  ? (k < 3 ? '#ffd43b' : '#fff3bf')
                  : admKind === 'dragon'
                    ? (k < 3 ? '#f06595' : '#cc5de8')
                    : (k < 3 ? '#ff922b' : '#495057')
              });
            }

            playCannonSound();
            screenShake = Math.max(screenShake, 4);
          }

          drawShip(ship);
          drawShipHpBar(ship);
        }

        // 更新并绘制飞行中的手绘加农炮弹
        for (let i = cannonballs.length - 1; i >= 0; i--) {
          const cb = cannonballs[i];
          if (cb.targetBug && bugs.includes(cb.targetBug)) {
            cb.targetX = cb.targetBug.x;
            cb.targetY = cb.targetBug.y;
          } else if (cb.targetShip && shipAlive(cb.targetShip)) {
            cb.targetX = cb.targetShip.x;
            cb.targetY = cb.targetShip.y;
          }

          cb.progress += cb.speed;
          const t = Math.min(1, cb.progress);
          const arcHeight = Math.sin(t * Math.PI) * (cb.isUlt ? 76 : 48);
          cb.x = cb.startX + (cb.targetX - cb.startX) * t;
          cb.y = cb.startY + (cb.targetY - cb.startY) * t - arcHeight;

          cb.trail.push({ x: cb.x, y: cb.y });
          if (cb.trail.length > (cb.isUlt ? 11 : (cb.adm ? 12 : 8))) cb.trail.shift();

          if (cb.adm) {
            // 提督机甲专属炮弹：圣金光枪 / 紫霄雷光弹
            drawAdmiralShot(cb);
          } else {
          // 火焰黑烟拖尾
          ctx.save();
          for (let j = 0; j < cb.trail.length; j++) {
            const pt = cb.trail[j];
            const ratio = (j + 1) / cb.trail.length;
            ctx.globalAlpha = ratio * 0.68;
            ctx.fillStyle = j > cb.trail.length - 4 ? (cb.isUlt ? '#ff6b6b' : '#ff922b') : '#868e96';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, ratio * (cb.isUlt ? 9 : 6), 0, Math.PI * 2);
            ctx.fill();
          }

          // 手绘铁球加农炮弹
          ctx.globalAlpha = 1;
          ctx.fillStyle = '#2b2a29';
          ctx.strokeStyle = cb.isUlt ? '#ffd43b' : '#ff922b';
          ctx.lineWidth = cb.isUlt ? 3 : 2;
          ctx.beginPath();
          ctx.arc(cb.x, cb.y, cb.isUlt ? 10 : 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 高光小点
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(cb.x - 2.5, cb.y - 2.5, cb.isUlt ? 3 : 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
          }

          // 命中爆炸（大招炮弹带大范围溅射清虫！）
          if (cb.progress >= 1) {
            if (cb.adm) {
              activeEffects.push({
                kind: 'admiralFx',
                fx: 'hit',
                variant: cb.adm,
                x: cb.targetX,
                y: cb.targetY,
                seed: Math.random() * 1000,
                life: 1
              });
            } else {
              activeEffects.push({
                kind: 'cannonBlast',
                x: cb.targetX,
                y: cb.targetY,
                maxR: cb.isUlt ? cb.splashRadius : 38,
                life: 1
              });
            }
            screenShake = Math.max(screenShake, cb.isUlt ? 8 : 5);
            if (cb.splashRadius) {
              for (let b = bugs.length - 1; b >= 0; b--) {
                if (Math.hypot(bugs[b].x - cb.targetX, bugs[b].y - cb.targetY) <= cb.splashRadius) {
                  eliminateBug(bugs[b], 'cannon', true);
                }
              }
            } else if (cb.targetBug && bugs.includes(cb.targetBug)) {
              hitBug(cb.targetBug, 'cannon', true);
            } else if (cb.targetShip) {
              damageShip(cb.targetShip, cb.damage || 0, cb.attackerName);
            }
            cannonballs.splice(i, 1);
          }
        }
      }

      // ============================
      // 主循环
      // ============================
      function updateAndRender() {
        releasePendingBugs();
        frameCount++;

        ctx.clearRect(0, 0, width, height);
        ctx.save();

        if (screenShake > 0.2) {
          const sx = (Math.random() - 0.5) * screenShake;
          const sy = (Math.random() - 0.5) * screenShake;
          ctx.translate(sx, sy);
          screenShake *= 0.84;
        } else {
          screenShake = 0;
        }

        // 绘制并淡出残留污渍
        for (let i = splats.length - 1; i >= 0; i--) {
          const s = splats[i];
          drawSplat(s);
          s.alpha -= 0.0022;
          if (s.alpha <= 0) splats.splice(i, 1);
        }

        // 更新并绘制虫子
        const marginLeft = 28;
        const marginRight = width - 28;
        const marginTop = hideHud ? 30 : 86;
        const marginBottom = isObsMode ? height - 30 : height - 150;

        for (const bug of bugs) {
          // 出生弹跳缩放
          if (bug.scale < 1) {
            bug.scale = Math.min(1, bug.scale + 0.12);
          }

          const id = bug.type.id;
          let speedMult = (bug.dizzy > 0 ? 0.35 : 1) * (bug.speedFactor || 1);
          let wobble = 0;

          // 按物种区分真实习性与速度节奏
          bug.behaviorTimer--;
          if (id === 'caterpillar') {
            // 毛毛虫：一伸一缩的蠕动节奏
            speedMult *= 0.32 + 0.95 * Math.abs(Math.sin(bug.wigglePhase * 0.45));
          } else if (id === 'spider') {
            // 蜘蛛：走走停停 + 突然短距猛窜
            if (bug.behaviorTimer <= 0) {
              if (bug.state === 'pause') {
                bug.state = 'dash';
                bug.targetAngle += (Math.random() - 0.5) * 2.4;
                bug.behaviorTimer = 18 + Math.random() * 20;
              } else {
                bug.state = 'pause';
                bug.behaviorTimer = 28 + Math.random() * 45;
              }
            }
            speedMult *= bug.state === 'pause' ? 0.04 : 2.15;
          } else if (id === 'grasshopper') {
            // 蚂蚱：平时慢爬，蓄力后猛地向前大跳
            if (bug.behaviorTimer <= 0) {
              if (bug.state === 'hop') {
                bug.state = 'move';
                bug.hopAir = 0;
                bug.behaviorTimer = 65 + Math.random() * 80;
              } else {
                bug.state = 'hop';
                bug.targetAngle += (Math.random() - 0.5) * 1.6;
                bug.behaviorTimer = 22;
              }
            }
            if (bug.state === 'hop') {
              const hopT = 1 - bug.behaviorTimer / 22;
              bug.hopAir = Math.sin(hopT * Math.PI);
              speedMult *= 5.2;
            } else {
              bug.hopAir = 0;
              speedMult *= 0.65;
            }
          } else if (id === 'dragonfly') {
            // 蜻蜓：极速直线俯冲 + 突然空中悬停再折向飙飞
            if (bug.behaviorTimer <= 0) {
              if (bug.state === 'pause') {
                bug.state = 'dash';
                bug.targetAngle += (Math.random() - 0.5) * 2.8;
                bug.behaviorTimer = 30 + Math.random() * 40;
              } else {
                bug.state = 'pause';
                bug.behaviorTimer = 32 + Math.random() * 36;
              }
            }
            speedMult *= bug.state === 'pause' ? 0.03 : 1.18;
          } else if (id === 'butterfly') {
            // 蝴蝶：优雅宽幅波浪飘飞
            wobble = Math.sin(frameCount * 0.08 + bug.wigglePhase * 0.35) * 0.85;
          } else if (id === 'bee') {
            wobble = Math.sin(frameCount * 0.18 + bug.wigglePhase) * 0.5;
          } else if (id === 'mosquito') {
            // 蚊子：高频锯齿乱窜
            wobble = Math.sin(frameCount * 0.42 + bug.wigglePhase) * 0.95;
          } else if (id === 'cockroach') {
            // 蟑螂：时不时爆发冲刺
            if (bug.behaviorTimer <= 0) {
              bug.state = bug.state === 'dash' ? 'move' : 'dash';
              bug.behaviorTimer = bug.state === 'dash' ? 28 : 40 + Math.random() * 40;
            }
            speedMult *= bug.state === 'dash' ? 1.45 : 0.78;
          } else if (id === 'ghost') {
            // 小鬼：上下飘荡，时不时隐身瞬移到别处
            wobble = Math.sin(frameCount * 0.05 + bug.wigglePhase * 0.2) * 0.6;
            if (bug.behaviorTimer <= 0) {
              if (bug.state === 'move') {
                bug.state = 'fade';
                bug.behaviorTimer = 30;
              } else if (bug.state === 'fade') {
                const p = safeSpawnPos();
                bug.x = p.x; bug.y = p.y; bug.trail = [];
                bug.state = 'appear';
                bug.behaviorTimer = 30;
                bug.bubble = ['嘿嘿', '略~', '来呀'][Math.floor(Math.random() * 3)];
                bug.bubbleTimer = 90;
              } else {
                bug.state = 'move';
                bug.behaviorTimer = 200 + Math.random() * 220;
              }
            }
            if (bug.state === 'fade') bug.ghostAlpha = Math.max(0.08, bug.behaviorTimer / 30);
            else if (bug.state === 'appear') bug.ghostAlpha = Math.min(1, 1 - bug.behaviorTimer / 30);
            else bug.ghostAlpha = 0.85 + Math.sin(frameCount * 0.07) * 0.1;
            speedMult *= bug.state === 'move' ? 1 : 0.3;
          } else if (id === 'monster') {
            // 小怪兽：摇摆走路，时不时停下来张嘴吼
            wobble = Math.sin(frameCount * 0.12 + bug.wigglePhase) * 0.25;
            if (bug.behaviorTimer <= 0) {
              if (bug.state === 'roar') {
                bug.state = 'move';
                bug.behaviorTimer = 150 + Math.random() * 150;
              } else {
                bug.state = 'roar';
                bug.behaviorTimer = 45;
                bug.bubble = ['嗷!', '吼~', '饿!'][Math.floor(Math.random() * 3)];
                bug.bubbleTimer = 60;
                if (screenShake < 3) screenShake = 3;
              }
            }
            speedMult *= bug.state === 'roar' ? 0 : 1;
          }
          if (bug.hurtFlash > 0) bug.hurtFlash = Math.max(0, bug.hurtFlash - 0.05);

          bug.wigglePhase += (id === 'snail' ? 0.06 : 0.22) * Math.max(0.5, bug.type.speed * (bug.state === 'pause' ? 0.15 : 1));

          // 随机转向（蜗牛/独角仙转向平缓，蚂蚁/蚊子转向频繁）
          bug.turnTimer--;
          if (bug.turnTimer <= 0) {
            const turnRange = (id === 'snail' || id === 'rhino') ? 0.85 : (id === 'mosquito' || id === 'ant' ? 2.8 : 2.0);
            bug.targetAngle += (Math.random() - 0.5) * turnRange;
            bug.turnTimer = (id === 'mosquito' || id === 'ant')
              ? 14 + Math.random() * 32
              : (id === 'snail' || id === 'rhino')
                ? 70 + Math.random() * 90
                : 28 + Math.random() * 65;
          }

          // 平滑旋转角度
          let diff = bug.targetAngle - bug.angle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const turnSmooth = (id === 'snail' || id === 'rhino') ? 0.05 : (id === 'dragonfly' || id === 'cockroach' ? 0.18 : 0.1);
          bug.angle += diff * turnSmooth;

          bug.vx = Math.cos(bug.angle + wobble) * bug.type.speed * speedMult;
          bug.vy = Math.sin(bug.angle + wobble) * bug.type.speed * speedMult;

          bug.x += bug.vx;
          bug.y += bug.vy;

          // 碰到边界反弹回画布内
          if (bug.x < marginLeft) {
            bug.x = marginLeft;
            bug.angle = Math.PI - bug.angle;
            bug.targetAngle = bug.angle;
          } else if (bug.x > marginRight) {
            bug.x = marginRight;
            bug.angle = Math.PI - bug.angle;
            bug.targetAngle = bug.angle;
          }
          if (bug.y < marginTop) {
            bug.y = marginTop;
            bug.angle = -bug.angle;
            bug.targetAngle = bug.angle;
          } else if (bug.y > marginBottom) {
            bug.y = marginBottom;
            bug.angle = -bug.angle;
            bug.targetAngle = bug.angle;
          }

          // 特色轨迹记录（蜜蜂/蚊子/蝴蝶/蜗牛）
          if ((id === 'bee' || id === 'mosquito' || id === 'butterfly' || id === 'snail') && frameCount % (id === 'snail' ? 6 : 3) === 0) {
            bug.trail.push({ x: bug.x, y: bug.y });
            const maxTrail = id === 'snail' ? 22 : 14;
            if (bug.trail.length > maxTrail) bug.trail.shift();
          }

          // 情绪气泡刷新
          bug.bubbleTimer--;
          if (bug.bubbleTimer <= 0) {
            bug.bubble = Math.random() < 0.22 ? ['!', '?', '♪', '饿', 'zzz'][Math.floor(Math.random() * 5)] : null;
            bug.bubbleTimer = 100 + Math.random() * 180;
          }

          drawBug(bug);
          drawStackLabel(bug);
        }

        // 更新并绘制大航海战舰与加农炮弹
        updateShipsAndCannons();

        // 绘制特效
        drawEffects();

        // 更新并绘制粒子
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= 0.94;
          p.vy *= 0.94;
          if (p.vrot) p.rot += p.vrot;
          p.life -= p.decay;

          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }

          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.translate(p.x, p.y);
          if (p.rot) ctx.rotate(p.rot);

          if (p.kind === 'smoke') {
            const r = p.size * (1.8 - p.life);
            ctx.globalAlpha = p.life * 0.55;
            ctx.fillStyle = '#343a40';
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.fill();
          } else if (p.kind === 'puff') {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.arc(0, 0, p.size * p.life, 0, Math.PI * 2);
            ctx.stroke();
          } else if (p.kind === 'star') {
            ctx.fillStyle = '#ffe066';
            ctx.strokeStyle = '#2b2a29';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let k = 0; k < 5; k++) {
              const a = (k * 4 * Math.PI) / 5;
              const px = Math.cos(a) * p.size;
              const py = Math.sin(a) * p.size;
              if (k === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          } else if (p.kind === 'crumb') {
            ctx.fillStyle = p.color;
            ctx.strokeStyle = '#2b2a29';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            ctx.roundRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.65, 2);
            ctx.fill();
            ctx.stroke();
          } else {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.moveTo(-p.size / 2, 0);
            ctx.lineTo(p.size / 2, 0);
            ctx.stroke();
          }
          ctx.restore();
        }

        // 更新并绘制飘字
        for (let i = floatTexts.length - 1; i >= 0; i--) {
          const ft = floatTexts[i];
          ft.y += ft.vy;
          ft.vy *= 0.96;
          ft.life -= 0.022;
          if (ft.life <= 0) {
            floatTexts.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = ft.life;
          ctx.translate(ft.x, ft.y);
          ctx.scale(ft.scale, ft.scale);
          ctx.font = '900 18px "Comic Sans MS", "PingFang SC", sans-serif';
          ctx.textAlign = 'center';
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#fff';
          ctx.strokeText(ft.text, 0, 0);
          ctx.fillStyle = ft.color;
          ctx.fillText(ft.text, 0, 0);
          ctx.restore();
        }

        ctx.restore();
        requestAnimationFrame(updateAndRender);
      }

      // ============================
      // 交互事件
      // ============================
      btnSummon.addEventListener('click', () => {
        summonBugs(1 + (Math.random() < 0.35 ? 1 : 0));
      });

      btnSwarm.addEventListener('click', () => {
        summonBugs(8);
      });

      btnShip.addEventListener('click', () => {
        summonShip({
          user: '测试舰长',
          gift: '粉丝团灯牌',
          attackCount: 1,
          durationSec: 60,
          ultHits: 5
        });
      });

      let guardTestIndex = 0;
      document.getElementById('btnGuard').addEventListener('click', () => {
        guardTestIndex++;
        summonShip({ user: `测试新舰长${guardTestIndex}`, gift: '舰长', mode: 'guard', attackCount: 3, durationSec: 1800, ultHits: 5 });
      });

      document.getElementById('btnGift').addEventListener('click', () => {
        // 模拟 5 元礼物：15% 概率杀虫剂（威力 60%），否则不掉虫子（只有人气票掉虫子）
        if (Math.random() < 0.15) triggerPesticide(60, '测试观众', '测试礼物');
        else showToast('🎲 测试观众送出「测试礼物」（只有人气票才掉虫子）');
      });

      btnAdmiral.addEventListener('click', () => {
        const existingAdmiral = ships.find((s) => s.cls.isAdmiral);
        if (existingAdmiral) {
          summonShip({
            user: existingAdmiral.ownerName,
            gift: '粉丝团灯牌',
            shipClass: existingAdmiral.cls.id,
            mode: 'admiral',
            attackCount: 1,
            ultHits: 5,
            autoFireSec: Math.max(0, (existingAdmiral.autoFireUntil - performance.now()) / 1000) + 60
          });
          return;
        }
        const cls = ADMIRAL_SHIP_CLASSES[admiralVariantIndex % ADMIRAL_SHIP_CLASSES.length];
        admiralVariantIndex++;
        summonShip({
          user: cls.id === 'admiral_titan' ? '尊贵提督·天穹' : '尊贵提督·紫霄',
          gift: '粉丝团灯牌',
          shipClass: cls.id,
          mode: 'admiral',
          attackCount: 1,
          ultHits: 5,
          autoFireSec: 60   // 调试面板里每个灯牌 60 秒自动杀虫，方便看效果
        });
      });

      btnKill.addEventListener('click', () => {
        triggerMassKill();
      });

      btnBgToggle.addEventListener('click', () => {
        const isTransparent = document.body.classList.toggle('transparent-bg');
        btnBgToggle.textContent = isTransparent ? '⬜' : '🖼️';
        showToast(isTransparent ? '⬜ 已切换为纯透明背景' : '🖼️ 已切换为模拟直播间画面');
        playPopSound(1);
      });

      btnSound.addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        btnSound.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) playPopSound(1);
      });

      weaponChips.forEach((chip) => {
        chip.addEventListener('click', () => {
          weaponChips.forEach((c) => c.classList.remove('active'));
          chip.classList.add('active');
          currentWeapon = chip.dataset.weapon;
          playPopSound(1);
        });
      });

      // ============================
      // 心动盲盒手绘宝箱与随机纸条系统
      // ============================
      const BLIND_BOX_CARDS = [
        '"当然啦"卡(10个句)',
        '尾句喵卡(1分钟)',
        '指定动态卡(1条)',
        '复读机(弹幕最后1条读1分钟)',
        '道歉卡(可指定)',
        '分手挽留卡(可指定)',
        '亲亲卡(可指定)',
        '撒娇八连卡(可指定)',
        '土味情话卡(可指定)',
        '天下第一卡(可指定)',
        '降智卡',
        '强制爱卡',
        '汪汪卡(指定一首歌)',
        '万能指定卡(其他任何1个)',
        '示爱卡(可指定)',
        '戏精卡',
        '点歌卡',
        '上舰卡',
        '舰礼卡',
        '真心话',
        '夸夸卡',
        '魅惑八连卡',
        '乞讨卡',
        '简笔画卡',
        '奶茶卡',
        '违禁词卡',
        '含水唱儿歌卡',
        '绕口令(夹子音)',
        '认错八连',
        '撒娇八连',
        '霸气八连',
        '鬼故事',
        '读诗/文（可指定）'
      ];

      function playChestOpenSound() {
        const ac = ensureAudio();
        if (!ac) return;
        const now = ac.currentTime;
        // 欢快闪亮开箱琶音 (C5 - E5 - G5 - C6)
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'triangle';
          const t = now + idx * 0.065;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.001, t);
          gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
          osc.connect(gain).connect(ac.destination);
          osc.start(t);
          osc.stop(t + 0.38);
        });
      }

      const blindBoxQueue = [];
      let blindBoxPlaying = false;
      let blindBoxCloseTimer = null;
      let blindBoxOpenTimer = null;
      let blindBoxShakeTimer = null;

      // 心动盲盒节奏（毫秒）：落下 -> 晃动 -> 开箱弹纸条 -> 停留后消失，整套约 3 秒
      const BLIND_BOX_SHAKE_AT_MS = 300;     // 落下后多久开始晃
      const BLIND_BOX_OPEN_AT_MS = 650;      // 落下后多久开箱弹纸条
      const BLIND_BOX_NOTE_SHOW_MS = 2400;   // 纸条停留多久后消失

      function closeCurrentBlindBox() {
        clearTimeout(blindBoxCloseTimer);
        clearTimeout(blindBoxOpenTimer);
        clearTimeout(blindBoxShakeTimer);
        chestOverlay.classList.remove('active', 'dropping', 'shaking', 'opened');
        blindBoxPlaying = false;
        if (blindBoxQueue.length > 0) {
          setTimeout(processBlindBoxQueue, 260);
        }
      }

      function processBlindBoxQueue() {
        if (blindBoxPlaying || blindBoxQueue.length === 0) return;
        blindBoxPlaying = true;
        const item = blindBoxQueue.shift();

        const cardText = item.card || BLIND_BOX_CARDS[Math.floor(Math.random() * BLIND_BOX_CARDS.length)];
        noteBadge.textContent = item.user
          ? `💖 ${item.user} 的${item.gift || '心动盲盒'}`
          : '💖 心动盲盒 · 随机纸条';
        noteText.textContent = cardText;


        // 阶段 1: 宝箱弹跳落入屏幕中央
        chestOverlay.classList.remove('dropping', 'shaking', 'opened');
        chestOverlay.classList.add('active', 'dropping');
        playPopSound(2);

        // 阶段 2: 宝箱晃动蓄力
        blindBoxShakeTimer = setTimeout(() => {
          chestOverlay.classList.add('shaking');
        }, BLIND_BOX_SHAKE_AT_MS);

        // 阶段 3: 宝箱自动开启 + 纸条弹出 + 金星礼花爆发
        blindBoxOpenTimer = setTimeout(() => {
          chestOverlay.classList.remove('shaking');
          chestOverlay.classList.add('opened');
          playChestOpenSound();
          screenShake = Math.max(screenShake, 7);

          // 在画布中央炸出缤纷手绘星星和彩带
          const cx = width * 0.5;
          const cy = height * 0.5;
          const colors = ['#ff6b9d', '#ffd43b', '#74c0fc', '#8ce99a', '#ffa94d', '#da77f2'];
          for (let i = 0; i < 32; i++) {
            const a = Math.random() * Math.PI * 2;
            const spd = 3.5 + Math.random() * 7.5;
            particles.push({
              kind: i % 2 === 0 ? 'star' : 'scribble',
              x: cx,
              y: cy,
              vx: Math.cos(a) * spd,
              vy: Math.sin(a) * spd - 2.5,
              size: 6 + Math.random() * 8,
              rot: Math.random() * Math.PI * 2,
              vrot: (Math.random() - 0.5) * 0.35,
              life: 1.15,
              decay: 0.018 + Math.random() * 0.014,
              color: colors[i % colors.length]
            });
          }

          // 纸条弹出动画播完、留一点阅读时间后自动消失（不显示进度条）
          blindBoxCloseTimer = setTimeout(() => {
            closeCurrentBlindBox();
          }, BLIND_BOX_NOTE_SHOW_MS);
        }, BLIND_BOX_OPEN_AT_MS);
      }

      function triggerBlindBox(opts = {}) {
        blindBoxQueue.push(opts);
        processBlindBoxQueue();
      }

      btnBlindBox.addEventListener('click', () => {
        triggerBlindBox({ user: '', gift: '心动盲盒' });
      });

      // ============================
      // 连接 Go 后端 WebSocket（接收 B站直播间弹幕与礼物）
      // ============================
      function connectLiveWebSocket() {
        if (!window.location.protocol.startsWith('http')) return;
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${window.location.host}/ws`;
        let ws = null;

        function connect() {
          try {
            ws = new WebSocket(wsUrl);
          } catch (e) {
            setTimeout(connect, 3000);
            return;
          }

          ws.onmessage = (evt) => {
            try {
              const msg = JSON.parse(evt.data);
              // 船主人送了灯牌以外的礼物：自己的船也开炮
              if (msg.type !== 'ship_lamp' && msg.type !== 'summon_ship') shipReactToGift(msg);
              if (msg.type === 'pesticide') {
                triggerPesticide(msg.power || 50, msg.user || '', msg.gift || '');
              } else if (msg.type === 'summon_bug') {
                const total = msg.count || 1;
                const res = summonBugs(total, { silent: !!msg.user });
                if (msg.user) {
                  if (res.merged === 0) {
                    showToast(`🐛 ${msg.user} 送出「${msg.gift || '礼物'}」，召唤了 ${total} 只虫子！`);
                  } else {
                    showToast(`🐛 ${msg.user} 送出「${msg.gift || '礼物'}」，召唤 ${total} 只虫子（${res.merged} 只合体成大虫），场上共 ${totalBugCount()} 只！`);
                  }
                }
              } else if (msg.type === 'kill_single') {
                killSingleBugs(msg.count || 1, msg.user || '', msg.gift || '');
              } else if (msg.type === 'ship_lamp' || msg.type === 'summon_ship') {
                const noBugsBefore = bugs.length === 0;
                summonShip({
                  respawnSec: msg.respawn_sec || 180,
                  user: msg.user || '',
                  uid: msg.uid || 0,
                  avatar: msg.avatar || '',
                  gift: msg.gift || '粉丝团灯牌',
                  shipClass: msg.ship_class || '',
                  mode: msg.mode || '',
                  restore: !!msg.restore,
                  attackCount: msg.restore ? 0 : (msg.count || 1),
                  durationSec: msg.duration_sec || 0,
                  ultHits: msg.ult_hits || 5,
                  autoFireSec: msg.auto_fire_sec || 0,
                  expireAt: msg.expire_at || 0
                });
                // 场上没虫子：这次灯牌的炮火改打别人的船
                const myShip = findOwnerShip(msg.uid || 0, msg.user || '');
                if (!msg.restore && noBugsBefore && myShip && !myShip.sinking && (msg.batteries || 0) > 0 && hasEnemyShip(myShip)) {
                  myShip.pendingAttacks = 0;
                  queueShipPvp(myShip, msg.batteries, msg.gift || '粉丝团灯牌');
                }
              } else if (msg.type === 'blind_box') {
                triggerBlindBox({
                  user: msg.user || '',
                  gift: msg.gift || '心动盲盒',
                  card: msg.card || ''
                });
              }
            } catch (err) {
              console.warn('解析弹幕事件失败:', err);
            }
          };

          ws.onclose = () => {
            setTimeout(connect, 2500);
          };

          ws.onerror = () => {
            try { ws.close(); } catch (_) {}
          };
        }

        connect();
      }

      connectLiveWebSocket();

      // 非 OBS 调试模式下，开局先召唤 3 只小虫子热场
      if (!isObsMode) {
        setTimeout(() => {
          summonBugs(3);
          showToast('欢迎来到涂鸦大航海！点按钮或连 B站直播间开玩 ⛵');
        }, 250);
      }

      requestAnimationFrame(updateAndRender);
    })();
  </script>
